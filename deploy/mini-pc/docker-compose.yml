# iRacing Coach stack on the mini PC (architecture.md section 10; mini-pc skill).
# Released only with release.sh or the g-house-app steps; never `compose up` by hand.
services:
  app:
    image: ${APP_IMAGE}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8210:8080"
    # 3 GiB with the native stages (the server's default with coach-analysis in the image):
    # the 2.7 GiB shared worker budget plus 0.3 GiB margin; no swap (worker-interface.md section 6).
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    cpu_shares: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ${APP_DATA}:/data
      - type: volume
        source: nas
        target: /nas/apps
        volume:
          nocopy: true
      - /etc/localtime:/etc/localtime:ro
    # /health: database open and migrations applied; independent of the NAS.
    # `healthcheck` exits 0 only on a 200 from the COACH_BIND port (contracts/server-config.md).
    healthcheck:
      test: ["CMD", "/usr/local/bin/coach-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "3" }

volumes:
  # NAS `apps` export (admits 192.168.1.81 only, no credentials); nas-layout.md section 1.
  # Changing these options needs the volume recreated: settle them before editing.
  nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.82,nfsvers=4.1,soft,timeo=150,retrans=3,noatime
      device: ":/volume1/apps"
