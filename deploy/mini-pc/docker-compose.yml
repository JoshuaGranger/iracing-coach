# iRacing Coach stack on the mini PC (architecture.md section 10; mini-pc skill).
# Released only with release.sh or the g-house-app steps; never `compose up` by hand.
services:
  app:
    image: ${APP_IMAGE}
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8210:8080"
    # 3 GiB with the native stages (the server's default with coach-analysis in the image):
    # the 2.7 GiB shared worker budget plus 0.3 GiB margin; no swap (worker-interface.md section 6).
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    cpu_shares: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ${APP_DATA}:/data
      # Windows-built installers are published separately from the Linux image.
      # Keep prior releases under this folder; the static server supplies the download.
      - type: bind
        source: ${APP_DATA}/downloads
        target: /app/web/downloads
        read_only: true
        bind:
          create_host_path: false
      # The NAS folder is a host automount (g-house ops/host/systemd/mnt-nas-iracing-coach-iracing-coach.*:
      # apps/iracing-coach only, NFSv4.1, soft, idle after 120 s), not a Compose NFS volume. Docker mounts a
      # volume when the container starts, so the stack could not start while the NAS was unreachable.
      # The container holds the automount from the start; the server's first look inside mounts the NFS.
      # Bind the plain PARENT, with rslave. Measured on the host: binding the automount point itself mounts
      # the NFS at container start; Docker's default rprivate never shows the container the mount that
      # follows (the first look inside fails with ELOOP). create_host_path false: a missing parent fails the
      # start instead of becoming an empty local directory the archiver would fill.
      - type: bind
        source: /mnt/nas-iracing-coach
        target: /nas/apps
        bind:
          propagation: rslave
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    # /health: database open and migrations applied; independent of the NAS.
    # `healthcheck` exits 0 only on a 200 from the COACH_BIND port (contracts/server-config.md).
    healthcheck:
      test: ["CMD", "/usr/local/bin/coach-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "3" }
