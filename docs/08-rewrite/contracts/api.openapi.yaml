openapi: 3.1.0
info:
  title: iRacing Coach server API
  version: "1"
  description: |
    HTTP API used by the browser SPA and the collector's uploads, plus the JSON messages of the
    collector WebSocket (`collector-protocol.md`) and the live WebSocket (`live-frame.md`).
    Single source of truth for wire types (see README.md). No authentication (D7).
    Conventions:
    - IDs: `customer_id` (iRacing customer id, integer), `session_id` (integer), `analysis_id` (string),
      `setup_id` (integer), `job_id` (integer), `sha256` (lowercase hex).
    - Times are UTC ISO-8601. Nullable means "not measured / unknown", never zero.
    - Mutable user-authored resources carry `version`; writes send `If-Match: <version>`; a stale
      version returns 412 with the current resource.
    - Every POST, PUT and DELETE from the browser outbox carries `Idempotency-Key: <uuid>` (the
      client operation id, persisted with the queued write). The server stores the key with the
      response status and body for 7 days (`request_log` in `db-schema.sql`); a retry with the same
      key returns the stored response and performs nothing. A key reused with a different method or
      path returns 422. Uploads are idempotent by `sha256` instead.
    - Long or Python-backed work returns `202 JobRef`; progress arrives on `/api/v1/events`
      (`job_state`) and the result at `GET /api/v1/jobs/{job_id}`.
    - View payloads carry `ETag: "<analysis_id>-p<projection_version>"` and `Cache-Control: no-cache`.
    - `x-max-bytes` on a response is a hard server-side bound; exceeding it is a server defect.
    - Readers ignore and preserve unknown optional fields. Objects marked `x-source` pass a backend
      subtree through unchanged; its shape is owned by the named Python contract or module.
    - `x-consumed-fields` on an `x-source` object lists every backend field the web workstreams
      (W7, W8) read from it, as paths relative to the object: `a.b` nested key, `a[]` each array
      element, `a[][]` nested arrays, `*` any key. The projector (W5) copies the whole subtree; when
      a view must shrink to its `x-max-bytes`, only subtrees and fields outside these lists may be
      dropped. An empty list means no v1 screen reads the subtree. The browser reads nothing else
      from an `x-source` object; reading a new field is an additive contract change.
servers:
  - url: http://192.168.1.81:8210
  - url: http://minipc.tail4e6ca6.ts.net:8210

tags:
  - name: system
  - name: library
  - name: views
  - name: setups
  - name: tuning
  - name: user-data
  - name: jobs
  - name: ingest
  - name: live
  - name: admin

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness for the Compose healthcheck (DB open, migrations applied; independent of the NAS).
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/status:
    get:
      tags: [system]
      summary: Server, NAS, queue and collector state.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStatus" }

  /api/v1/events:
    get:
      tags: [system]
      summary: Server-sent events. One stream per tab; `data:` is one ServerEvent JSON object; `event:` equals its `type`.
      parameters:
        - { name: customer_id, in: query, required: false, schema: { type: integer }, description: Limit driver-scoped events to one driver. }
      responses:
        "200":
          description: text/event-stream of ServerEvent
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ServerEvent" }

  /api/v1/drivers:
    get:
      tags: [library]
      summary: Drivers that have data (D7 landing). One driver -> the SPA opens that driver directly.
      responses:
        "200":
          description: Drivers
          x-max-bytes: 65536
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverList" }

  /api/v1/drivers/{customer_id}:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [library]
      responses:
        "200":
          description: Driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/drivers/{customer_id}/sessions:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [library]
      summary: Sessions library, newest first. Filtering is server-side; grouping into events uses `event_key`.
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [all, race, qualify, practice, test] } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 }, description: "Text over track, layout, car, series." }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of sessions
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }

  /api/v1/drivers/{customer_id}/cars-and-tracks:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [setups]
      summary: Cars and tracks seen in this driver's recordings (Find a baseline choices).
      responses:
        "200":
          description: Options
          x-max-bytes: 262144
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarTrackOptions" }

  /api/v1/sessions/{session_id}:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      tags: [library]
      responses:
        "200":
          description: Session detail
          x-max-bytes: 131072
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/analysis:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      tags: [library]
      summary: Queue (re)analysis. Idempotent while one is queued or running for the same profile.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/analyses/{analysis_id}/race:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Race view (overview, laps, timeline, pit stops, incidents, conditions).
      responses:
        "200":
          description: Race view
          x-max-bytes: 2097152
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/runs:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      responses:
        "200":
          description: Runs view
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunsView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/investigation:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Sections and comparisons (race_investigation, schema 2, projection sections-trials-v7).
      responses:
        "200":
          description: Investigation view
          x-max-bytes: 4194304
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/traces/catalog:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Laps, signals, bins and steering basis for the Traces workspace.
      responses:
        "200":
          description: Trace catalog
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceCatalog" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/traces:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: |
        160-bin lap traces as a columnar binary container (`application/vnd.coach.columns`):
        bytes 0-3 "CCOL", u16 version 1, u16 reserved 0, u32 header length H, H bytes of UTF-8 JSON
        `TraceBlobHeader`, zero padding up to the data section, which starts at the first file offset
        at or after 12 + H that is a multiple of 8, then for each channel in header order a
        little-endian typed array of `laps.length x bins` values, lap-major, each array starting at
        its `offset` (from the start of the data section, a multiple of 8; zero padding between
        arrays). Bin i of a lap lies at lap fraction (i + 0.5) / bins, the backend's `lap_pct` for
        that distance bucket; a bucket the backend left empty is missing in every channel. Missing
        values are NaN (floats) or the channel's `missing` sentinel. Compressed with gzip/br when the
        client accepts it.
        Encoding rule: each channel copies one backend `lap_traces` point key (`TraceSignal.source_key`)
        in the backend's unit. Non-integer values are `f64` (exact copy of the Python double); `i16`/`u8`
        only for keys whose every value is an integer in range, with a `missing` sentinel outside the
        observed range; null, absent and non-finite backend values are missing. W5 tests that decoding
        every channel reproduces each backend value and its missingness exactly.
      parameters:
        - name: laps
          in: query
          description: Comma list of lap numbers or ranges (e.g. `1-40,52`); default all laps.
          schema: { type: string, maxLength: 2048 }
        - name: channels
          in: query
          description: Comma list of signal ids from the catalog; default the catalog's default set.
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Columnar traces
          x-max-bytes: 16777216
          headers:
            X-Coach-Trace-Laps: { schema: { type: integer }, description: "Number of laps in the body: the length of its TraceBlobHeader `laps` array." }
          content:
            application/vnd.coach.columns:
              schema: { type: string, format: binary }
              x-header-schema: { $ref: "#/components/schemas/TraceBlobHeader" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }
        "413":
          description: "Selection exceeds 16 MiB; narrow `laps` or `channels`. Only an analysis near the bound with every lap and channel selected reaches it; the browser then requests lap ranges (for example halves) and joins them."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/analyses/{analysis_id}/track:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Track geometry in the backend's normalized_local_vector space, copied without reprojection (map and cursor).
      responses:
        "200":
          description: Track geometry
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackGeometry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/drivers/{customer_id}/setups:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [setups]
      summary: Setup library (D9). Every setup seen in any recording, garage capture or export, plus `.sto` files with values unknown.
      parameters:
        - { name: car_path, in: query, schema: { type: string, maxLength: 160 } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: raced_only, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of setups
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupPage" }

  /api/v1/setups/{setup_id}:
    parameters:
      - { name: setup_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [setups]
      responses:
        "200":
          description: Setup detail
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/setups/compare:
    post:
      tags: [setups]
      summary: Compare two setups of the same car (Python `compare_iracing_setups`). Answers inline when done within the server's inline wait (default 10 s), else 202.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupCompareRequest" }
      responses:
        "200":
          description: Comparison
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCompareResult" }
        "202": { $ref: "#/components/responses/Accepted" }
        "422":
          description: Different cars or values unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/drivers/{customer_id}/baseline:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    post:
      tags: [setups]
      summary: Find a baseline (Python `build_open_setup_package`). Result is `contracts/setup-package-v1.schema.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaselineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/analyses/{analysis_id}/tuning:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [tuning]
      summary: "Progressive Tuning context for one analysis (eligibility, exact identity, turn map, representative runs). Unlike the view payloads it carries no ETag, because the server merges request-time fields (`binding`, `open_targets`, `draft_identity_key`) into the projected `tuning.json`; it is sent with Cache-Control no-cache."
      responses:
        "200":
          description: Tuning context
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/tuning/recommendations:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    post:
      tags: [tuning]
      summary: Structured recommendation (Python `recommend_structured_open_setup_tuning`, no AI). Result is `contracts/tuning-recommendation-v1.schema.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningRecommendRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning/experiments/{experiment_id}/outcome:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: experiment_id, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      tags: [tuning]
      summary: Record an experiment outcome (Python `record_open_setup_feedback`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningOutcomeRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning/history:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [tuning]
      summary: Tuning history for an analysis context (Python `iracing_setup_history`).
      parameters:
        - { name: analysis_id, in: query, required: true, schema: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning-drafts/{identity_key}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: identity_key, in: path, required: true, schema: { type: string, maxLength: 256 } }
    get:
      tags: [user-data]
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningDraft" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningDraftWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningDraft" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/turn-annotations/{track_config_key}/{map_identity}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: track_config_key, in: path, required: true, schema: { type: string, maxLength: 256 } }
      - { name: map_identity, in: path, required: true, schema: { type: string, maxLength: 128 } }
    get:
      tags: [user-data]
      responses:
        "200":
          description: Turn-name corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnAnnotations" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurnAnnotationsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnAnnotations" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/notes:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      parameters:
        - { name: subject_kind, in: query, required: true, schema: { $ref: "#/components/schemas/NoteSubjectKind" } }
        - { name: subject_id, in: query, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Notes for one subject
          x-max-bytes: 1048576
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/Note" } }
    post:
      tags: [user-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /api/v1/notes/{note_id}:
    parameters:
      - { name: note_id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/trace-layouts:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Named trace layouts (Default is built in and immutable)
          x-max-bytes: 1048576
          content:
            application/json:
              schema:
                type: object
                required: [layouts]
                properties:
                  layouts: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/TraceLayout" } }

  /api/v1/drivers/{customer_id}/trace-layouts/{layout_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { $ref: "#/components/parameters/LayoutId" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TraceLayoutWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceLayout" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/live-layouts:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Live dashboards (Default is built in and immutable) and the active one
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveLayoutList" }

  /api/v1/drivers/{customer_id}/live-layouts/{layout_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { $ref: "#/components/parameters/LayoutId" }
    put:
      tags: [user-data]
      summary: Save a live layout; if active, the server pushes it to the rig (`layout.set`).
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveLayoutWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveLayout" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/prefs:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Preferences, active live layout, last investigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPrefs" }
    put:
      tags: [user-data]
      summary: "Top-level merge: each field present in the body replaces the stored value (null clears it; `units` is replaced as a whole); absent fields keep their stored value. Sending the full body is valid."
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverPrefsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPrefs" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/jobs:
    get:
      tags: [jobs]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/JobState" } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Jobs, newest first
          x-max-bytes: 524288
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }

  /api/v1/jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      responses:
        "200":
          description: Job with result when finished
          x-max-bytes: 4194304
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{job_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "409":
          description: Already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/uploads:
    post:
      tags: [ingest]
      summary: Create or resume an upload; idempotent by sha256 (collector-protocol.md section 4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCreate" }
      responses:
        "200":
          description: Existing upload (resume) or already received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "201":
          description: New upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "413": { description: Larger than 4 GiB }
        "503":
          description: Spool full; retry after `Retry-After` seconds
          headers:
            Retry-After: { schema: { type: integer } }

  /api/v1/uploads/{sha256}:
    parameters: [{ $ref: "#/components/parameters/Sha256" }]
    head:
      tags: [ingest]
      responses:
        "200":
          description: Upload known
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-State: { schema: { $ref: "#/components/schemas/UploadStateName" } }
        "404": { description: Unknown upload }
    put:
      tags: [ingest]
      summary: Append one chunk (<= 8 MiB) at the durable offset. The completing chunk triggers hash verification.
      parameters:
        - { name: Content-Range, in: header, required: true, schema: { type: string, pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        "200":
          description: Chunk durable (state open) or file verified (state verified)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "409":
          description: Offset mismatch; continue from `offset`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "422":
          description: Whole-file hash mismatch; the partial file is discarded; restart from 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/live/channels:
    get:
      tags: [live]
      summary: The live channel, cue and tile table the server was built with (`live-channels.json`).
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema: { type: object, additionalProperties: true, x-source: docs/08-rewrite/contracts/live-channels.json, x-consumed-fields: [table_version] }

  /ws/live/{customer_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: rate, in: query, schema: { type: integer, enum: [1, 10, 30, 60], default: 30 } }
    get:
      tags: [live]
      summary: WebSocket upgrade. First text message LiveHello, then backlog and live binary frames (live-frame.md). Counts as a viewer.
      x-websocket:
        server-text: { $ref: "#/components/schemas/LiveHello" }
        client-text: { $ref: "#/components/schemas/LiveRateChange" }
        server-binary: live-frame.md
      responses:
        "101": { description: Switching protocols }

  /ws/collector:
    get:
      tags: [live]
      summary: Collector WebSocket, subprotocol `coach-collector.1` (collector-protocol.md).
      x-websocket:
        client-text: { $ref: "#/components/schemas/CollectorClientMessage" }
        server-text: { $ref: "#/components/schemas/CollectorServerMessage" }
        client-binary: live-frame.md
      responses:
        "101": { description: Switching protocols }

  /api/v1/admin/import:
    post:
      tags: [admin]
      summary: One-time import of legacy user-authored data (D12). Idempotent by bundle hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBundle" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "200":
          description: Bundle already imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }

  /api/v1/admin/reanalyze:
    post:
      tags: [admin]
      summary: Queue analysis of every session (optionally one driver) whose current analysis is missing or older than the worker's profile.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id: { type: [integer, "null"] }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/admin/snapshot:
    post:
      tags: [admin]
      summary: Take a user-data snapshot now (local and NAS).
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

components:
  parameters:
    CustomerId: { name: customer_id, in: path, required: true, schema: { type: integer } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: integer } }
    AnalysisId: { name: analysis_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    JobId: { name: job_id, in: path, required: true, schema: { type: integer } }
    LayoutId: { name: layout_id, in: path, required: true, schema: { type: string, maxLength: 64, pattern: "^[a-z0-9-]+$" } }
    Sha256: { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: "Current `version`; required to update or delete an existing resource." }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Accepted:
      description: Job queued (or the existing equivalent job)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobRef" }
    ProjectionPending:
      description: Analysis exists but its view files are being (re)built; retry on `analysis_ready`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: Stale `If-Match`; body is the current resource under `current`
      content:
        application/json:
          schema:
            type: object
            required: [error, current]
            properties:
              error: { const: version_conflict }
              current: { type: object, additionalProperties: true }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: "Stable code, e.g. not_found, invalid_request, hash_mismatch, projection_pending, exceeds_memory_budget" }
        message: { type: string }
        details: { type: [object, "null"], additionalProperties: true }

    Health:
      type: object
      required: [status, server_version, schema_version]
      properties:
        status: { const: ok }
        server_version: { type: string }
        schema_version: { type: integer }

    NasState:
      type: string
      enum: [ok, readonly, unreachable, stalled]

    ServerStatus:
      type: object
      required: [server_version, api_version, collector_protocol, live_table_version, projection_version, nas, spool, queue, collectors, disk_free_bytes]
      properties:
        server_version: { type: string }
        api_version: { const: 1 }
        collector_protocol: { type: integer }
        live_table_version: { type: integer }
        projection_version: { type: integer }
        worker_profile_version: { type: [string, "null"] }
        python_version: { type: [string, "null"] }
        collector_newer_than_server: { type: boolean, description: "A connected collector sent live frames with a table_version above the server's; those frames are not relayed (live-frame.md)." }
        nas:
          type: object
          required: [state, pending_archive]
          properties:
            state: { $ref: "#/components/schemas/NasState" }
            last_ok_at: { type: [string, "null"], format: date-time }
            pending_archive: { type: integer }
        spool:
          type: object
          required: [bytes, files, limit_bytes]
          properties:
            bytes: { type: integer }
            files: { type: integer }
            limit_bytes: { type: integer }
        queue:
          type: object
          required: [analysis, light, deferred]
          properties:
            analysis: { type: integer }
            light: { type: integer }
            deferred: { type: integer }
        collectors: { type: array, items: { $ref: "#/components/schemas/CollectorPresence" } }
        disk_free_bytes: { type: integer }

    CollectorPresence:
      type: object
      required: [collector_id, machine, collector_version, protocol, compatible, online, last_seen_at, viewers]
      properties:
        collector_id: { type: string, format: uuid }
        machine: { type: string }
        collector_version: { type: string }
        protocol: { type: integer }
        compatible: { type: boolean }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        status: { oneOf: [{ $ref: "#/components/schemas/CollectorStatusBody" }, { type: "null" }] }
        viewers: { type: integer }

    Driver:
      type: object
      required: [customer_id, name, session_count, live]
      properties:
        customer_id: { type: integer }
        name: { type: string }
        irating: { type: [integer, "null"] }
        session_count: { type: integer }
        last_session_at: { type: [string, "null"], format: date-time }
        live: { type: boolean, description: "A connected collector reports this driver in a session (D5)." }

    DriverList:
      type: object
      required: [drivers]
      properties:
        drivers: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/Driver" } }

    AnalysisState:
      type: string
      enum: [none, queued, running, ready, failed, deferred]

    SessionOverview:
      type: object
      description: Library row figures (from discovery and the current analysis). Null = not measured.
      additionalProperties: true
      properties:
        starting_position: { type: [integer, "null"] }
        final_position: { type: [integer, "null"] }
        recorded_laps: { type: [integer, "null"] }
        green_laps_estimated: { type: [number, "null"] }
        caution_laps_estimated: { type: [number, "null"] }
        pit_stops_detected: { type: [integer, "null"] }
        runs_detected: { type: [integer, "null"] }
        longest_green_run: { type: [integer, "null"] }
        pace_slope_s_per_lap: { type: [number, "null"] }
        pace_consistency_percent: { type: [number, "null"] }
        best_clean_lap_s: { type: [number, "null"] }
        fuel_used_gal: { type: [number, "null"] }

    SessionSummary:
      type: object
      required: [session_id, customer_id, group_key, event_key, recording_count, analysis_state, overview]
      properties:
        session_id: { type: integer }
        customer_id: { type: integer }
        group_key: { type: string }
        event_key: { type: string, description: "Groups phases of one event: 'subsession:<id>' or 'offline:<recording sha>'." }
        session_type: { type: [string, "null"] }
        track: { type: [string, "null"] }
        track_config: { type: [string, "null"] }
        car_path: { type: [string, "null"] }
        car_name: { type: [string, "null"] }
        series_name: { type: [string, "null"] }
        season_name: { type: [string, "null"] }
        subsession_id: { type: [integer, "null"] }
        sim_session_num: { type: [integer, "null"] }
        start_time_utc: { type: [string, "null"], format: date-time }
        recording_count: { type: integer }
        analysis_state: { $ref: "#/components/schemas/AnalysisState" }
        analysis_reason: { type: [string, "null"] }
        analysis_id: { type: [string, "null"] }
        overview: { $ref: "#/components/schemas/SessionOverview" }

    SessionPage:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/SessionSummary" } }
        next_cursor: { type: [string, "null"] }

    RecordingSummary:
      type: object
      required: [sha256, size, file_name, ingest_state, nas_state]
      properties:
        sha256: { type: string }
        size: { type: integer }
        file_name: { type: string }
        start_time_utc: { type: [string, "null"], format: date-time }
        ingest_state: { type: string, enum: [verified, parsed, discovered, failed] }
        nas_state: { type: string, enum: [pending, archived, failed] }

    AnalysisSummary:
      type: object
      required: [analysis_id, created_at, profile_version, projection_state, current]
      properties:
        analysis_id: { type: string }
        created_at: { type: string, format: date-time }
        profile_version: { type: string }
        lap_count: { type: [integer, "null"] }
        projection_version: { type: [integer, "null"] }
        projection_state: { type: string, enum: [pending, ready, failed] }
        current: { type: boolean }

    SessionDetail:
      type: object
      required: [session, recordings, analyses, setup_ids, notes_count]
      properties:
        session: { $ref: "#/components/schemas/SessionSummary" }
        recordings: { type: array, items: { $ref: "#/components/schemas/RecordingSummary" } }
        analyses: { type: array, items: { $ref: "#/components/schemas/AnalysisSummary" } }
        setup_ids: { type: array, items: { type: integer }, description: Setups observed in this session's recordings. }
        notes_count: { type: integer }
        event_sessions:
          type: array
          description: Other phases of the same event (phase switch).
          items:
            type: object
            required: [session_id, session_type]
            properties:
              session_id: { type: integer }
              session_type: { type: [string, "null"] }

    ViewEnvelope:
      type: object
      required: [analysis_id, projection_version, schema_version, profile_version]
      properties:
        analysis_id: { type: string }
        projection_version: { type: integer }
        schema_version: { type: integer, description: "analysis_view schema the view was projected from: 1 (crate-api.md section 5 lists the accepted inputs)." }
        profile_version: { type: string, description: "analysis_profile_version; empty string when the backend left it null." }

    Lap:
      type: object
      description: One recorded lap (backend `laps[]` projected; unknown backend fields preserved).
      additionalProperties: true
      x-consumed-fields:
        # backend keys passed through beside the named fields (comparison-exclusion rule,
        # RuntimeMapper.LapComparisonExclusionReasons; pit and position timeline)
        - lap
        - lap_time_s
        - complete
        - flag_state
        - green_fraction
        - caution_fraction
        - pit_time_s
        - position.start
        - position.end
        - racing_state_fraction
        - clean_context.on_track_fraction
        - clean_context.traffic_proximity_fraction
        - damage_repair_context.automatic_coaching_reference_eligible
        - damage_repair_context.exclusion_reason_codes
      required: [lap, comparison_eligible, exclusion_reasons]
      properties:
        lap: { type: integer }
        lap_time_s: { type: [number, "null"] }
        comparison_eligible:
          type: boolean
          description: "Projector-computed: exclusion_reasons is empty (C# AnalysisLap not Confounded)."
        exclusion_reasons:
          type: array
          items: { type: string }
          description: |
            Projector-computed codes, RuntimeMapper.LapComparisonExclusionReasons (RuntimeMapper.cs:2525-2547) over the
            backend laps[] in ascending `lap` order (stable), previous flag = the preceding lap's flag_state trimmed and
            lowercased. flag = this lap's flag_state trimmed, lowercased, missing as "". In order: "partial" when complete
            is not true; "caution_or_mixed" when flag != "green"; "pit" when pit_time_s >= 1; "not_racing_state" when
            racing_state_fraction < 0.98; "off_track" when clean_context.on_track_fraction < 0.98; "close_traffic" when
            clean_context.traffic_proximity_fraction >= 0.10; "restart" when the previous flag is "caution" and flag is
            "green"; then damage_repair_context.exclusion_reason_codes (a string, or an array's non-null items, blanks
            dropped; any other non-null value is one code, its JSON text), or
            "damage_repair_context" when there are none and automatic_coaching_reference_eligible is false. A missing
            or non-finite number skips its test. Duplicates removed case-insensitively, first kept. The browser
            humanizes codes for display.
        pit_in: { type: [boolean, "null"], description: "Backend laps[].pit_entry." }
        pit_out: { type: [boolean, "null"], description: "Backend laps[].pit_exit." }
        run_number: { type: [integer, "null"], description: "The runs[] entry whose lap_numbers contains this lap." }
        run_age_laps: { type: [number, "null"], description: "Accumulated green exposure in the run (race_investigation.laps[].green_exposure)." }

    RaceView:
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [identity, race_summary, laps]
          properties:
            identity:
              type: object
              additionalProperties: true
              x-source: "analysis_view.identity"
              x-consumed-fields: [track_name, track_path, track_config, car_name, car_path, is_fixed_setup, event_type, setup_fingerprint, series_name, season_name, session_start, driver_name, customer_id]
            race_summary:
              type: object
              additionalProperties: true
              x-source: "analysis_view.race_summary"
              x-consumed-fields: [recorded_laps, scheduled_laps, scheduled_minutes, pit_stops_detected, starting_position, final_recorded_position, green_laps_estimated, caution_laps_estimated, fuel_used_gal]
            race_grades:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.race_grades"
              x-consumed-fields:
                - overall_grade
                - rubric_version
                - rubric.version
                - categories[].key
                - categories[].label
                - categories[].grade
                - categories[].score
                - categories[].evidence_type
                - categories[].explanation
                - categories[].improvement
                - categories[].limitations
                - categories[].weight_percent
                - categories[].effective_weight
                - unavailable_categories[].key
                - unavailable_categories[].label
                - unavailable_categories[].reason
                - unavailable_categories[].weight_percent
            laps: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/Lap" } }
            strategy:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.strategy (pit stops, timeline)"
              x-consumed-fields:
                - confidence
                - measured_green_fuel_gal_per_lap
                - measured_caution_fuel_gal_per_lap
                - forecast.status
                - forecast.scheduled_laps
                - forecast.all_green_range_laps
                - forecast.race_plan_decision   # whole object, contracts/race-plan-decision-v1.schema.json
                - pit_assessments[].run_number
                - pit_assessments[].post_stop_all_green_range_laps
                - pit_assessments[].pit_cycle_position_change
                - pit_assessments[].scheduled_race_laps_remaining_after_stop
            damage_repair:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.damage_repair (contracts/damage-repair-v1.schema.json)"
              x-consumed-fields:
                - status
                - limitations
                - summary.pit_road_episodes
                - summary.tow_episodes
                - summary.recorded_repair_episodes
                - summary.confirmed_fast_repair_uses
                - summary.total_pit_road_time_s
                - summary.total_repair_work_completed_s
                - incident_points.events[].candidate_lap
                - incident_points.events[].points_added
                - incident_points.events[].session_time_s
                - incident_points.events[].count_before
                - incident_points.events[].count_after
                - incident_points.events[].source_channel
                - incident_points.events[].event_type
                - incident_points.events[].contact_target
                - incident_points.events[].track_location
                - incident_points.events[].on_pit_road
                - incident_points.events[].speed_mph
                - incident_points.events[].yaw_rate_deg_s
                - incident_points.events[].slip_angle_deg
                - episodes[].run_context.overlapping_run_numbers
                - episodes[].timing.repair_work_completed_s
            field_pace: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.field_pace", x-consumed-fields: [] }
            conditions: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.conditions", x-consumed-fields: [] }
            data_quality: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.data_quality", x-consumed-fields: [confidence] }

    RunsView:
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [runs]
          properties:
            runs:
              type: array
              maxItems: 200
              description: "Observed trend segments and screened fit stay distinct (AGENTS.md)."
              items: { $ref: "#/components/schemas/BackendRun" }
            corner_tire_age: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.corner_tire_age", x-consumed-fields: [] }
            tire_learning: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.tire_learning", x-consumed-fields: [] }

    BackendRun:
      type: object
      description: "One backend run, passed through. Read by Runs, Traces (tire wear row) and Progressive Tuning."
      additionalProperties: true
      x-source: "analysis_view.runs[]"
      x-consumed-fields:
        - run_number
        - lap_numbers
        - green_laps
        - caution_laps
        - ended_with_pit_stop
        - ended_under_caution
        - coaching_reference_lap_numbers
        - tire_measurement_status
        - fuel.used_gal
        - pace.green_lap_time_slope_s_per_lap
        - pace.early_average_lap_s
        - pace.late_average_lap_s
        - pace.early_to_late_delta_s
        - damage_repair_context.automatic_coaching_reference_eligible
        - damage_repair_context.exclusion_reason_codes
        - damage_repair_context.reason_codes
        - driving_load.early_brake_vs_late_percent
        - driving_load.early_steer_vs_late_percent
        - tire_observation.lowest_remaining_percent
        - tire_observation.lowest_remaining_tire
        - tire_observation.tires.*.average_remaining_percent
        - tire_observation.tires.*.remaining_percent.*
        - tire_observation.tires.*.carcass_temperature_f.*
        - tire_observation.tires.*.surface_temperature_f.*
        - tire_observation.tires.*.pressure.psi
        - tire_observation.tires.*.pressure.kind
        - pit_service.start_time
        - pit_service.end_time
        - pit_service.fuel_added_l
        - pit_service.tires_changed_observed
        - pit_service.penalty_served_s

    InvestigationView:
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [race_investigation]
          properties:
            race_investigation:
              type: object
              additionalProperties: true
              x-source: "analysis_view.race_investigation (race_investigation.py schema 2, projection sections-trials-v7; test-data/race-investigation.json)"
              x-consumed-fields:
                # RaceInvestigationMapper.cs; trial fields (actions[].trial, actions[].early_run_version) are parked (D8)
                - schema_version
                - projection_version
                - status
                - summary
                - default_comparison_id
                - limitations
                - comparisons[].id
                - comparisons[].kind
                - comparisons[].title
                - comparisons[].summary
                - comparisons[].delta_s
                - comparisons[].eligibility
                - comparisons[].pace_comparable
                - comparisons[].pace_unusable_reasons
                - comparisons[].baseline.label
                - comparisons[].baseline.run_number
                - comparisons[].baseline.lap_numbers
                - comparisons[].baseline.lap_count
                - comparisons[].baseline.eligible_lap_numbers
                - comparisons[].baseline.excluded_laps[].lap
                - comparisons[].baseline.excluded_laps[].reasons
                - comparisons[].baseline.median_lap_s
                - comparisons[].baseline.green_age_start
                - comparisons[].baseline.green_age_end
                - comparisons[].baseline.fuel_start_gal
                - comparisons[].baseline.track_temp_f
                - comparisons[].baseline.representative_lap
                - comparisons[].compared.*      # same keys as baseline
                - comparisons[].metrics[].key
                - comparisons[].metrics[].label
                - comparisons[].metrics[].unit
                - comparisons[].metrics[].baseline
                - comparisons[].metrics[].compared
                - comparisons[].metrics[].delta
                - comparisons[].metrics[].evidence
                - comparisons[].metrics[].detail
                - comparisons[].corners[].id
                - comparisons[].corners[].label
                - comparisons[].corners[].short_label
