        profile_version: { type: string, description: "analysis_profile_version; empty string when the backend left it null." }

    Lap:
      type: object
      description: |
        One recorded lap (backend `laps[]` projected; unknown backend fields preserved). The backend's `clean_context`
        passes through. `traffic_proximity_fraction` is the share of the observed lap time with a car ahead within
        max(25 m, 0.75 s) or behind within max(15 m, 0.40 s) (recorded CarDistAhead and CarDistBehind); `close_traffic`
        screens a lap at >= 0.10. `traffic_ahead_fraction` and `traffic_behind_fraction` (number or null, 4 decimals,
        null without the distance channels) are each side's share alone: a sample with a car close on both sides counts
        once in the combined share, so neither side exceeds it. `traffic_side` ("ahead", "behind", "both" or null) is
        null when the combined share is 0 or null; "both" when each side's share is >= 0.10; else the side whose share
        is; else the side with the larger share, "both" when they are equal. An analysis written before 2026-10-05 lacks
        the three keys: unknown, not open air.
      additionalProperties: true
      x-consumed-fields:
        # backend keys passed through beside the named fields (comparison-exclusion rule,
        # RuntimeMapper.LapComparisonExclusionReasons; pit and position timeline; the traffic marker's side)
        - lap
        - lap_time_s
        - complete
        - flag_state
        - green_fraction
        - caution_fraction
        - pit_time_s
        - position.start
        - position.end
        - racing_state_fraction
        - clean_context.on_track_fraction
        - clean_context.traffic_proximity_fraction
        - clean_context.traffic_ahead_fraction
        - clean_context.traffic_behind_fraction
        - clean_context.traffic_side
        - damage_repair_context.automatic_coaching_reference_eligible
        - damage_repair_context.exclusion_reason_codes
      required: [lap, comparison_eligible, exclusion_reasons]
      properties:
        lap: { type: integer }
        lap_time_s: { type: [number, "null"] }
        comparison_eligible:
          type: boolean
          description: "Projector-computed: exclusion_reasons is empty (C# AnalysisLap not Confounded)."
        exclusion_reasons:
          type: array
          items: { type: string }
          description: |
            Projector-computed codes, RuntimeMapper.LapComparisonExclusionReasons (RuntimeMapper.cs:2525-2547) over the
            backend laps[] in ascending `lap` order (stable), previous flag = the preceding lap's flag_state trimmed and
            lowercased. flag = this lap's flag_state trimmed, lowercased, missing as "". In order: "partial" when complete
            is not true; "caution_or_mixed" when flag != "green"; "pit" when pit_time_s >= 1; "not_racing_state" when
            racing_state_fraction < 0.98; "off_track" when clean_context.on_track_fraction < 0.98; "close_traffic" when
            clean_context.traffic_proximity_fraction >= 0.10; "restart" when the previous flag is "caution" and flag is
            "green"; then damage_repair_context.exclusion_reason_codes (a string, or an array's non-null items, blanks
            dropped; any other non-null value is one code, its JSON text), or
            "damage_repair_context" when there are none and automatic_coaching_reference_eligible is false. A missing
            or non-finite number skips its test. Duplicates removed case-insensitively, first kept. The browser
            humanizes codes for display.
        pit_in: { type: [boolean, "null"], description: "Backend laps[].pit_entry." }
        pit_out: { type: [boolean, "null"], description: "Backend laps[].pit_exit." }
        run_number: { type: [integer, "null"], description: "The runs[] entry whose lap_numbers contains this lap." }
        run_age_laps: { type: [number, "null"], description: "Accumulated green exposure in the run (race_investigation.laps[].green_exposure)." }

    RaceView:
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [identity, race_summary, laps]
          properties:
            identity:
              type: object
              additionalProperties: true
              x-source: "analysis_view.identity"
              x-consumed-fields: [track_name, track_path, track_config, car_name, car_path, is_fixed_setup, event_type, setup_fingerprint, series_name, season_name, session_start, driver_name, customer_id]
            race_summary:
              type: object
              additionalProperties: true
              x-source: "analysis_view.race_summary"
              x-consumed-fields: [recorded_laps, scheduled_laps, scheduled_minutes, pit_stops_detected, starting_position, final_recorded_position, green_laps_estimated, caution_laps_estimated, fuel_used_gal, finish]
              properties:
                finish:
                  type: [object, "null"]
                  additionalProperties: true
                  description: >-
                    The backend's `race_summary.finish` (backlog #97), null outside a Race: `status` (`checkered`: the race
                    session's `SessionState` reached checkered or cool-down in the recording; `recording_ended`: it reached
                    racing and never either, so the recording stopped before the race did; `unknown`), `finished` (true,
                    false, null for those three), `last_lap` (the lap in progress at the end of the recording),
                    `position_at_end` (that lap's last recorded position), `last_session_state`, `laps_remaining_at_end`
                    (`SessionLapsRemainEx` at the last sample; null without a lap limit), `evidence_class`
                    (`measured_session_state`) and `rule`.
            race_grades:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.race_grades"
