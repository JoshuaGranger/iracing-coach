            `representative_runs`.
          oneOf:
            - { $ref: "#/components/schemas/ObservedTrend" }
            - { type: "null" }

    ObservedTrend:
      type: object
      description: >-
        The straight least-squares line of the backend's `lap_time_s` against the lap number over one run's counted laps:
        the run's `race.json` `laps[]` rows (by `run_number`) that are complete, `flag_state` green, under 1 s on pit road,
        neither pit-in nor pit-out, timed, carry no `exclusion_reasons` but `close_traffic` (so close traffic is included;
        caution, partial, pit, not-racing-state, off-track, tow or repair and the `restart` lap after a caution are not), and
        are not the `candidate_lap` of a `damage_repair.incident_points` event. An observed trend, distinct from the
        backend's screened pace fit (`race_investigation.runs[].fit`), which leaves traffic laps out; it is drawn only
        between `first_lap` and `last_lap`, never extended.
      required: [slope_s_per_lap, intercept_s, first_lap, last_lap, laps_used]
      additionalProperties: false
      properties:
        slope_s_per_lap: { type: number, description: "Seconds per lap, 4 decimals; positive is slowing." }
        intercept_s: { type: number, description: "The line's lap time at lap 0, seconds, 4 decimals: the time at lap x is intercept_s + slope_s_per_lap * x." }
        first_lap: { type: integer, minimum: 1, description: "First counted lap." }
        last_lap: { type: integer, minimum: 1, description: "Last counted lap." }
        laps_used: { type: integer, minimum: 3, description: "Counted laps." }

