            pit_stops:
              type: array
              maxItems: 200
              description: "One entry per run that ends in a pit service, in run order (projector-written from `runs[].pit_service`). Empty when no service was detected."
              items: { $ref: "#/components/schemas/PitStop" }
            strategy:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.strategy (pit stops, timeline)"
              x-consumed-fields:
                - confidence
                - measured_green_fuel_gal_per_lap
                - measured_caution_fuel_gal_per_lap
                - forecast.status
                - forecast.scheduled_laps
                - forecast.all_green_range_laps
                - forecast.race_plan_decision   # whole object, contracts/race-plan-decision-v1.schema.json
                - pit_assessments[].run_number
                - pit_assessments[].post_stop_all_green_range_laps
                - pit_assessments[].pit_cycle_position_change
                - pit_assessments[].scheduled_race_laps_remaining_after_stop
            damage_repair:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.damage_repair (contracts/damage-repair-v1.schema.json)"
              x-consumed-fields:
                - status
                - limitations
                - summary.pit_road_episodes
                - summary.tow_episodes
                - summary.recorded_repair_episodes
                - summary.confirmed_fast_repair_uses
                - summary.total_pit_road_time_s
                - summary.total_repair_work_completed_s
                - incident_points.events[].candidate_lap
                - incident_points.events[].points_added
                - incident_points.events[].session_time_s
                - incident_points.events[].count_before
                - incident_points.events[].count_after
                - incident_points.events[].source_channel
                - incident_points.events[].event_type
                - incident_points.events[].contact_target
                - incident_points.events[].track_location
                - incident_points.events[].on_pit_road
                - incident_points.events[].speed_mph
                - incident_points.events[].yaw_rate_deg_s
                - incident_points.events[].slip_angle_deg
                - episodes[].run_context.overlapping_run_numbers
                - episodes[].timing.repair_work_completed_s
            field_pace:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.field_pace"
              x-consumed-fields: [results]
              properties:
                results:
                  type: [object, "null"]
                  additionalProperties: true
                  description: |
                    Optional Python field_results schema 1. cars are ordered by recorded overall position (unknown last).
                    Each car carries car_index, driver_name, car_number, is_player, position, position_source,
                    laps_completed, fastest_lap_s, fastest_source, pace_median_s, pace_lap_count, pit_visits,
                    tires_taken, fuel_used_l, laps and pit_events. Unknown quantities are null, never inferred zero.
                    Order is a recorded snapshot, not confirmed final classification. Positive SDK ResultsPositions
                    positions and holes are preserved; only a snapshot explicitly starting at zero is shifted by one.
                    Competitor timing measures
                    intervals between consecutive completed-lap counter transitions within the selected session,
                    without sample gaps over 2 seconds or intervening unscoped samples. Distance wraps are linearly
                    interpolated when both adjacent samples cover start/finish; otherwise transition timestamps
                    produce approximate sampled intervals. Delayed CarIdxLastLapTime values are not assigned to laps.
                    Pace is the median of at least three whole recorded green laps with known pit-road state and no
                    pit samples, traffic included. Pit visits count observed off-to-on pit-road transitions during
                    racing; drive-throughs count and pre-recording entries do not. Competitor tires and fuel are null.
                    Player lap timing prefers backend lap summaries when their sample span belongs to this phase.
                    Player tires use positive tires_changed_observed, excluding post-run or unscoped service;
                    an empty observed list does not prove zero tires. Fuel sums known complete phase-scoped laps.
                    laps contain lap, lap_time_s, lap_time_source, position, flag_state, on_pit_road, pace_eligible.
                    lap_time_source/fastest_source distinguish backend player timing, recorded_interpolated_distance_crossings,
                    recorded_lap_counter_intervals and session_results_snapshot. pit_events contain
                    lap, session_time_s, evidence_class. Quantities pass through unchanged. To fit the 2 MiB race
                    budget, per-car laps may be omitted with progression_unavailable_reason=payload_budget;
                    participant summaries and pit events remain. Old analyses may omit results entirely.
            conditions: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.conditions", x-consumed-fields: [] }
            data_quality: { type: [object, "null"], additionalProperties: true, x-source: "analysis_view.data_quality", x-consumed-fields: [confidence] }

    PitStop:
      type: object
      description: |
        One pit service. `lap` is the run's `end_lap`, the lap the car enters the pits. Window, tires and fuel are the
        backend's `pit_service` values; nothing is measured here. Null means the backend did not report it.
      required: [run_number, lap, post_run_service]
      properties:
        run_number: { type: [integer, "null"], description: "The run this service ended." }
        lap: { type: [integer, "null"] }
        start_time_s: { type: [number, "null"], description: "Session time the service began (pit_service.start_time)." }
        end_time_s: { type: [number, "null"], description: "Session time the service ended (pit_service.end_time)." }
        service_s: { type: [number, "null"], description: "end_time_s - start_time_s, 3 decimals; the detected service window (stall, service-active or fuel-rise samples bridged within 2.5 s), not pit-lane time. Null when either end is missing." }
        tires_changed:
          type: [array, "null"]
          description: "Tires the backend observed changed (pit_service.tires_changed_observed): LF, LR, RF, RR, ascending. An empty list means none observed changed; null means the backend did not report the list."
          items: { type: string, enum: [LF, LR, RF, RR] }
        fuel_added_l: { type: [number, "null"], description: "pit_service.fuel_added_l; 0 is a measured no-fuel stop." }
        fuel_added_gal: { type: [number, "null"], description: "fuel_added_l / 3.785411784 rounded to 3 decimals (the analyzer's own conversion)." }
        post_run_service: { type: boolean, description: "The run ended with a post-run service (run.ended_with_post_run_service), e.g. after the checkered flag." }

