    SteeringBasis:
      type: object
      description: "TD-037: road-wheel steering when the ratio is known; never guessed. A declaration that is not basis road_wheel with steering_ratio > 0 is read as steering-wheel angle (SteeringBasisMapper.cs)."
      additionalProperties: true
      x-source: "analysis_view.lap_traces.steering (steering_basis.py)"
      x-consumed-fields: [basis, status, label, steering_ratio, steering_ratio_text, ratio_source, setup_steering_offset, reason, definition]
      required: [basis]
      properties:
        basis: { type: string, enum: [road_wheel, steering_wheel, unknown] }
        steering_ratio: { type: [number, "null"] }
        digits: { type: [integer, "null"] }

    TraceSignal:
      type: object
      required: [id, source_key, label, unit, dtype]
      properties:
        id: { type: string, description: "Stable signal id used by layouts and the cursor (e.g. speed, throttle, steering)." }
        source_key: { type: string, description: "Backend analysis_view.lap_traces point key copied into this channel (e.g. speed_mph)." }
        label: { type: string }
        short_label: { type: [string, "null"] }
        unit: { type: string, description: "The backend key's unit, as served (steering ids carry rad; the browser converts for display, rad to degrees)." }
        digits: { type: [integer, "null"] }
        category: { type: [string, "null"] }
        minimum: { type: [number, "null"] }
        maximum: { type: [number, "null"] }
        dtype: { type: string, enum: [f64, i16, u8] }
        default: { type: boolean, description: In the default channel set. }

    TraceLap:
      type: object
      required: [lap, comparison_eligible, exclusion_reasons]
      additionalProperties: true
      description: "One lap_traces.traces[] entry without its points (the points are in the CCOL body)."
      x-consumed-fields: [lap, lap_time_s, complete, flag_state, flag_states, green_fraction, caution_fraction, pit_time_s, pit_entry, pit_exit, fuel_used_gal]
      properties:
        lap: { type: integer }
        lap_time_s: { type: [number, "null"] }
        comparison_eligible:
          type: boolean
          description: "Joined from Lap by lap number (the first Lap with that number, C# lapsByNumber): its comparison_eligible; false when no Lap has this number (RuntimeMapper.cs:542-582)."
        exclusion_reasons:
          type: array
          items: { type: string }
          description: "The joined Lap's exclusion_reasons; [\"eligibility_not_recorded\"] when no Lap has this number."
        run_number: { type: [integer, "null"] }
        run_age_laps: { type: [number, "null"] }
        conditions:
          type: [object, "null"]
          additionalProperties: true
          x-source: "analysis_view.lap_traces.traces[].conditions"
          x-consumed-fields: [sky, track_temperature_f, air_temperature_f, wind_speed_mph, wind_direction_degrees, relative_humidity_percent, fog_percent, air_pressure_inhg, air_density_lb_ft3, precipitation_percent, track_wetness_state, track_usage_percent, track_usage, weather_declared_wet]

    TraceCatalog:
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [bins_per_lap, laps, signals, steering_basis, budgets]
          properties:
            bins_per_lap: { type: integer, description: "160 today (about 0.6 % of a lap). Bin i lies at lap fraction (i + 0.5) / bins_per_lap (the CCOL rule on the traces endpoint)." }
            laps: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/TraceLap" } }
            signals:
              type: array
              maxItems: 128
              items: { $ref: "#/components/schemas/TraceSignal" }
              description: |
                The 15 fixed signals in this order when their backend key occurs (id <- source key): speed <- speed_mph,
                session-time <- session_time_s, throttle, brake, steering <- steering_rad, steering-peak <-
                steering_abs_peak_rad, slip <- slip_angle_deg, yaw <- yaw_rate_deg_s, lateral-g <- lateral_g,
                longitudinal-g <- longitudinal_g, gear, rpm, latitude, longitude, tire-stress <- tire_stress_proxy; then the
                backend's additional signals in backend order, up to 128 in all.
            omitted_signals: { type: array, maxItems: 1024, items: { type: string }, description: "Backend additional-signal keys beyond the 128-signal cap; not in the CCOL body." }
            sector_start_pcts: { type: array, maxItems: 64, items: { type: number }, description: "lap_traces.sector_start_pcts, ascending lap fractions in [0, 1) (Traces sector bands)." }
            steering_basis: { $ref: "#/components/schemas/SteeringBasis" }
            budgets:
              type: object
              description: "Rendering budgets single-sourced here (AnalysisTrackMapGeometry.cs:132-146)."
              required: [vertex_budget_per_signal, min_points_per_trace, max_color_groups, cursor_detail_traces, max_trace_rows]
              properties:
                vertex_budget_per_signal: { const: 48000 }
                min_points_per_trace: { const: 48 }
                max_color_groups: { const: 20 }
                cursor_detail_traces: { const: 24 }
                max_trace_rows: { const: 10 }

    TraceBlobHeader:
      type: object
      required: [format, version, analysis_id, projection_version, bins, laps, channels]
      properties:
        format: { const: CCOL }
        version: { const: 1 }
        analysis_id: { type: string }
        projection_version: { type: integer }
        bins: { type: integer }
        laps: { type: array, items: { type: integer } }
        channels:
          type: array
          items:
            type: object
            required: [id, dtype, offset, byte_length]
            properties:
              id: { type: string }
              dtype: { type: string, enum: [f64, i16, u8] }
              offset: { type: integer }
              byte_length: { type: integer }
              missing: { type: [integer, "null"], description: "Sentinel for integer dtypes; floats use NaN." }

    PathSeries:
      type: object
      required: [pct, x, y]
      description: "Parallel arrays of one backend path's points (x, y, lap_pct)."
      properties:
        pct: { type: array, items: { type: [number, "null"] } }
        x: { type: array, items: { type: number } }
        y: { type: array, items: { type: number } }

    TrackPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
        lap_pct: { type: [number, "null"] }

    TrackLine:
      type: object
      required: [a, b]
      properties:
        a: { $ref: "#/components/schemas/TrackPoint" }
        b: { $ref: "#/components/schemas/TrackPoint" }

    GeometryTransform:
      type: object
      description: "Maps recorded GPS into the geometry's space: x = (longitude - source_bounds.minimum_x) / normalization_scale, y = (source_bounds.maximum_y - latitude) / normalization_scale (race_foundations.py:226-247; C# AnalysisGeometryTransform.TryNormalize)."
      required: [source_bounds, normalization_scale]
      properties:
        source_bounds:
          type: object
          required: [minimum_x, maximum_x, minimum_y, maximum_y]
          properties:
            minimum_x: { type: number }
            maximum_x: { type: number }
            minimum_y: { type: number }
            maximum_y: { type: number }
        normalization_scale: { type: number, exclusiveMinimum: 0 }

    TrackGeometry:
      description: "Backend track_geometry copied in its own coordinate space (no reprojection). Served only when the backend geometry has a main path; otherwise 404 and the browser uses the lap-distance strip."
      allOf:
        - { $ref: "#/components/schemas/ViewEnvelope" }
        - type: object
          required: [coordinate_space, status, main_path, provenance]
          properties:
            coordinate_space: { const: normalized_local_vector, description: "track_geometry.coordinate_system; unit square, y down." }
            status: { type: string, description: "track_geometry.status (usable, partial, unavailable, ...)." }
            track_configuration_key: { type: [string, "null"] }
            geometry_hash: { type: [string, "null"] }
            main_path: { $ref: "#/components/schemas/PathSeries" }
            pit_lane: { oneOf: [{ $ref: "#/components/schemas/PathSeries" }, { type: "null" }] }
            pit_entry: { oneOf: [{ $ref: "#/components/schemas/PathSeries" }, { type: "null" }], description: "track_geometry.pit_entry_path" }
            pit_exit: { oneOf: [{ $ref: "#/components/schemas/PathSeries" }, { type: "null" }], description: "track_geometry.pit_exit_path" }
            start_finish: { oneOf: [{ $ref: "#/components/schemas/TrackLine" }, { type: "null" }], description: "track_geometry.start_finish_line" }
            pit_commitment_line: { oneOf: [{ $ref: "#/components/schemas/TrackLine" }, { type: "null" }] }
            pit_merge_line: { oneOf: [{ $ref: "#/components/schemas/TrackLine" }, { type: "null" }] }
            transform: { oneOf: [{ $ref: "#/components/schemas/GeometryTransform" }, { type: "null" }], description: "track_geometry.transform, else geometry_provenance.normalization_transform; null for legacy geometry." }
            quality:
              type: [object, "null"]
              additionalProperties: true
              x-source: "analysis_view.track_geometry.quality"
              x-consumed-fields: [main_loop_complete, lap_percent_coverage, maximum_lap_percent_gap, closure_distance]
            provenance: { type: object, additionalProperties: true, x-source: "analysis_view.track_geometry.geometry_provenance", x-consumed-fields: [] }

    CarTrackOptions:
      type: object
      required: [cars, tracks]
      properties:
        cars:
          type: array
          items:
            type: object
            required: [car_path]
            properties:
              car_path: { type: string }
              car_name: { type: [string, "null"] }
        tracks:
          type: array
          items:
            type: object
            required: [track]
            properties:
              track: { type: string }
              track_config: { type: [string, "null"] }

    SetupSource:
      type: string
      enum: [recording, garage_snapshot, garage_commit, htm_export]

    SetupFileEntry:
      type: object
      required: [sha256, car_folder, relative_path, format, present]
      properties:
        sha256: { type: string }
        car_folder: { type: string }
        relative_path: { type: string }
        format: { type: string, enum: [sto, htm] }
        present: { type: boolean }
        linked_setup_id: { type: [integer, "null"], description: "Null = values unknown (encrypted .sto, never seen unmodified). Derived by the server when it answers, never stored: only from an observation with is_modified = false or an htm_export of the file (collector-protocol.md section 8)." }

    SetupSummary:
      type: object
      required: [setup_id, customer_id, car_path, names, sources, observation_count, raced, first_seen_at, last_seen_at]
      properties:
        setup_id: { type: integer }
        customer_id: { type: integer }
        car_path: { type: string }
        car_name: { type: [string, "null"] }
        names: { type: array, items: { type: string }, description: "Known .sto names linked to these values." }
        sto_files: { type: array, items: { $ref: "#/components/schemas/SetupFileEntry" } }
        sources: { type: array, items: { $ref: "#/components/schemas/SetupSource" } }
        observation_count: { type: integer }
        raced: { type: boolean, description: "Seen in a Race session recording." }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    SetupPage:
      type: object
      required: [setups, unlinked_files]
      properties:
        setups: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/SetupSummary" } }
        unlinked_files: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/SetupFileEntry" } }
        next_cursor: { type: [string, "null"] }

    SetupObservation:
      type: object
      required: [source, observed_at]
      properties:
        source: { $ref: "#/components/schemas/SetupSource" }
        observed_at: { type: string, format: date-time }
        setup_name: { type: [string, "null"] }
        sto_sha256: { type: [string, "null"] }
        is_modified: { type: [boolean, "null"] }
        load_type: { type: [string, "null"] }
        session_id: { type: [integer, "null"] }
        analysis_id: { type: [string, "null"], description: "The session's current analysis (recording observations), so Tune this setup needs no second request." }
        visit_id: { type: [string, "null"] }

    SetupDetail:
      type: object
      required: [setup, values, identity_excluded_keys, observations]
      properties:
        setup: { $ref: "#/components/schemas/SetupSummary" }
        values:
          type: object
          description: CarSetup leaf key (e.g. Chassis.LeftFront.Camber) to the published string.
          maxProperties: 4096
          additionalProperties: { type: string }
        identity_excluded_keys: { type: array, items: { type: string }, description: "Keys excluded from identity (setup-keys.json)." }
        observations: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/SetupObservation" } }

    SetupCompareRequest:
      type: object
      required: [left_setup_id, right_setup_id]
      properties:
        left_setup_id: { type: integer }
        right_setup_id: { type: integer }

    SetupCompareRow:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        label: { type: [string, "null"] }
        left: { type: [string, "null"] }
        right: { type: [string, "null"] }
        status: { type: string, enum: [changed, unknown, identical] }
        readout: { type: boolean, description: "Derived readout, not a setting." }

    SetupCompareResult:
      type: object
      required: [rows, identical_count]
      properties:
        rows: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/SetupCompareRow" } }
        identical_count: { type: integer }
        backend:
          type: object
          additionalProperties: true
          x-source: "compare_iracing_setups result (schema_version 1)"
          x-consumed-fields: [schema_version, counts.changed, counts.unknown, counts.identical, counts.readouts_changed, equality_rule, readout_rule]

    BaselineRequest:
      type: object
      required: [season, car, track]
      properties:
        season: { type: string, maxLength: 32 }
        car: { type: string, maxLength: 160 }
        track: { type: string, maxLength: 160 }
        analysis_id: { type: [string, "null"] }
        track_characteristics: { type: [string, "null"], maxLength: 4000 }

    TuningSessionIdentity:
      type: object
      description: |
        Exact analysis identity, field for field from C# TuningSessionIdentity as filled by
        RuntimeMapper.MapTuningIdentity (RuntimeMapper.cs:1735-1783). Sources are analysis_view
        keys. C# RaceId, EventKey and Selector are server-bound (TuningSessionBinding); C#
        AnalysisPath is server-internal and replaced by analysis_id. Null = not recorded.
      additionalProperties: true
      required: [analysis_id, setup_type, embedded_setup_available, source_sha256]
      properties:
        analysis_id: { type: string, description: "analysis.json analysis_id." }
        iracing_session_id: { type: [string, "null"], description: "C# SessionId: identity.session_id (WeekendInfo.SessionID), else source.selection.sim_session_num; decimal text." }
        session_unique_id: { type: [integer, "null"], description: "identity.session_unique_id" }
        subsession_id: { type: [integer, "null"], description: "identity.subsession_id, else source.selection.subsession_id" }
        session_type: { type: [string, "null"], description: "source.selection.sim_session_type, else identity.event_type" }
        track_configuration_key: { type: [string, "null"], description: "track_geometry.track_configuration_key, else identity.track_configuration_key" }
        track_id: { type: [integer, "null"], description: "identity.track_id" }
        track: { type: [string, "null"], description: "Display name: RuntimeMapper.DisplayTrack(identity.track_name, else identity.track_path)." }
        layout: { type: [string, "null"], description: "RuntimeMapper.DisplayLayout(identity.track_config)." }
        car_id: { type: [integer, "null"], description: "identity.car_id" }
        car_path: { type: [string, "null"], description: "identity.car_path" }
        car: { type: [string, "null"], description: "RuntimeMapper.DisplayCar(identity.car_name, else identity.car_path)." }
        setup_type: { type: string, description: "Open when identity.is_fixed_setup is false, Fixed when true, else Humanize(identity.setup_type), else Unknown." }
        setup_fingerprint: { type: [string, "null"], description: "identity.setup_fingerprint" }
        embedded_setup_available: { type: boolean, description: "identity.embedded_setup_available, or identity.setup_parameter_count > 0, or a non-empty identity.setup object." }
        source_sha256:
          type: array
          description: "Union of track_geometry.contributing_source_sha256 (else source_sha256), track_geometry.observed_source_sha256 (else source_sha256) and source.fingerprints[].sha256; 64-hex values only, lowercase, unique, ascending."
          items: { type: string, pattern: "^[0-9a-f]{64}$" }

    TuningSessionBinding:
      type: object
      description: "Library binding filled by the server at request time (C# RaceId, EventKey, Selector)."
      required: [session_id, event_key, group_key]
      properties:
        session_id: { type: integer }
        event_key: { type: string }
        group_key: { type: string, description: "Worker selector (sessions.group_key)." }

    TuningMapPoint:
      type: object
      required: [lap_pct, x, y]
      properties:
        lap_pct: { type: number }
        x: { type: number }
        y: { type: number }

    TuningTurn:
      type: object
      description: "C# TuningTurn. Detected sections are never official turns (AGENTS.md)."
      additionalProperties: true
      required: [corner_id, label, start_pct, apex_pct, end_pct, is_official, confidence, user_verified, verification_source]
      properties:
        corner_id: { type: string, description: "tuning_map turn corner_id (else id, else turn-<n>); detected segments use detected-<segment>." }
        label: { type: string }
        start_pct: { type: number }
        apex_pct: { type: number, description: "Supplied apex_pct, else the forward-arc midpoint of start and end (RuntimeMapper.MidpointPercent)." }
        end_pct: { type: number }
        is_official: { type: boolean }
        confidence: { type: string, description: "Supplied confidence, else Unknown; Detected for detected segments." }
        correction_hint: { type: [string, "null"] }
        user_verified: { type: boolean, description: "Always false in the projection; set by the browser from TurnAnnotations." }
        verification_source: { type: string, description: "Empty in the projection." }

    TuningMapView:
      type: object
      description: |
        C# TuningMapView from RuntimeMapper.MapTuningMap (RuntimeMapper.cs:1785-1846): the
        backend tuning_map when it has at least two finite points, else track_geometry.main_path
        (lap_pct, else index / (n - 1)), else track_profile.shape. Turns from tuning_map turns or
        corners, else track_profile.detected_corner_segments.
      additionalProperties: true
      required: [map_identity, source_type, source_label, confidence, is_verified, path, turns]
      properties:
        map_identity: { type: string, description: "tuning_map.map_identity, else map_id, else the track configuration key, else analysis:<analysis_id>." }
        source_type: { type: string, description: "tuning_map.source_type, else telemetry-derived." }
        source_label: { type: string, description: "tuning_map.source_label, else Verified track map (supplied map) or Recorded racing geometry." }
        source_url: { type: [string, "null"] }
        confidence: { type: string, description: "tuning_map.confidence, else Recorded (path has 2+ points) or Unavailable." }
        verification_message: { type: [string, "null"] }
        is_verified: { type: boolean }
        path: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/TuningMapPoint" } }
        turns: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TuningTurn" } }
        geometry_hash: { type: [string, "null"], description: "tuning_map.geometry_hash, else track_geometry.geometry_hash." }

    TuningContextProjection:
      type: object
      description: |
        Written by the projector as tuning.json (crate-api.md section 5). Eligibility ports
        ProgressiveTuningCoordinator.Candidate for an analysed recording (finalized and exact by
        construction).
      required: [analysis_id, eligible, can_use_as_evidence, reasons, identity, map, representative_runs]
      properties:
        analysis_id: { type: string }
        eligible: { type: boolean, description: "Can receive a garage recommendation: setup_type Open, embedded setup, setup fingerprint, and analysis_id plus a track configuration key or layout." }
        can_use_as_evidence: { type: boolean, description: "Always true for an analysed recording; a fixed-setup race supplies driving evidence for an open target." }
        reasons: { type: array, items: { type: string }, description: "C# MissingRequired texts, then Blockers texts, in that order." }
        identity: { $ref: "#/components/schemas/TuningSessionIdentity" }
        map: { $ref: "#/components/schemas/TuningMapView" }
        representative_runs:
          type: array
          maxItems: 200
          description: "analysis_view.runs[] entries a driver may pick (TuningPage.EligibleRuns): damage_repair_context eligible (no automatic_coaching_reference_eligible false, no exclusion or reason codes) and at least 6 non-negative coaching_reference_lap_numbers; ascending run_number. The driver picks at most 3."
          items: { $ref: "#/components/schemas/BackendRun" }

    TuningOpenTarget:
      type: object
      description: |
        Another analysis of the same driver that can receive the recommendation. Included when its
        TuningContextProjection.eligible is true (ProgressiveTuningCoordinator.OpenTarget) and
        CompatibleOpenTarget(evidence = this context's identity, target = its identity) holds
        (ProgressiveTuningCoordinator.cs:68-82), in this order: target setup_type is "Open"
        (case-insensitive); target embedded_setup_available; target setup_fingerprint non-blank; both
        track_configuration_key non-blank and equal (ordinal, case-sensitive); then the car: when both
        car_id are present they must be equal; otherwise both car_path must be non-blank and equal
        case-insensitively; otherwise no match. A missing or blank key never matches; layout is not
        a fallback.
      required: [analysis_id, binding, identity]
      properties:
        analysis_id: { type: string }
        binding: { $ref: "#/components/schemas/TuningSessionBinding" }
        start_time_utc: { type: [string, "null"], format: date-time }
        identity: { $ref: "#/components/schemas/TuningSessionIdentity" }

    TuningContext:
      description: |
        tuning.json plus the server-bound fields. draft_identity_key = lowercase hex SHA-256 of the
        UTF-8 text of these values joined by "|", each trimmed and lowercased, null as "",
        integers in decimal (ProgressiveTuningCoordinator.TuningIdentityKey order): analysis_id,
        session_unique_id, subsession_id, session_type, track_configuration_key, car_id, car_path,
        setup_fingerprint, source_sha256 joined by ",", binding.session_id, binding.event_key,
        binding.group_key.
      allOf:
        - { $ref: "#/components/schemas/TuningContextProjection" }
        - type: object
          required: [binding, open_targets, draft_identity_key]
          properties:
            binding: { $ref: "#/components/schemas/TuningSessionBinding" }
            open_targets: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/TuningOpenTarget" }, description: "Newest first; empty when identity.setup_type is Open (TuningPage.NeedsOpenTarget)." }
            draft_identity_key: { type: string, pattern: "^[0-9a-f]{64}$" }

    TuningDraftWrite:
      type: object
      required: [body]
      properties:
        body: { $ref: "#/components/schemas/TuningDraftBody" }

    TuningDraftBody:
      type: object
      description: "C# ProgressiveTuningDraft as the browser keeps it. Unknown fields round-trip. D12 maps legacy drafts to these fields."
      additionalProperties: true
      properties:
        goal: { type: [string, "null"], description: "TuningRecommendRequest.goal value." }
        general_note: { type: string, maxLength: 4000 }
        representative_run_ids: { type: array, maxItems: 3, items: { type: string, maxLength: 80 }, description: "run_number values as decimal text." }
        open_target_analysis_id: { type: [string, "null"] }
        feedback: { type: array, maxItems: 100, items: { type: object, additionalProperties: true, description: "TuningFeedbackItem fields; a draft may hold incomplete items." } }

    TuningDraft:
      allOf:
        - { $ref: "#/components/schemas/TuningDraftWrite" }
        - type: object
          required: [identity_key, version, updated_at]
          properties:
            identity_key: { type: string }
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    TurnAnnotationsWrite:
      type: object
      required: [body]
      properties:
        body:
          type: object
          description: "Turn-name corrections for one track configuration and map identity. Unknown fields round-trip."
          additionalProperties: true
          properties:
            corners: { type: array, maxItems: 100, items: { type: object, additionalProperties: true, description: "TuningMapCorner fields (corner_id, label, start_pct, apex_pct, end_pct)." } }

    TurnAnnotations:
      allOf:
        - { $ref: "#/components/schemas/TurnAnnotationsWrite" }
        - type: object
          required: [track_config_key, map_identity, version, updated_at]
          properties:
            track_config_key: { type: string }
            map_identity: { type: string }
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    TuningFeedbackItem:
      type: object
      description: "C# ProgressiveTuningFeedback; closed because the worker's input schema is closed (mcp_server.py:714-737). Omit a pct rather than send null."
      additionalProperties: false
      required: [corner_id, run_phase, corner_phases, symptom_id]
      properties:
        feedback_id: { type: string, maxLength: 160 }
        corner_id: { type: string, minLength: 1, maxLength: 160 }
        corner_label: { type: string, maxLength: 160 }
        start_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        apex_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        end_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        run_phase: { type: string, enum: [early, middle, late] }
        corner_phases: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, enum: [entry, center, exit, whole] } }
        symptom_id: { type: string, maxLength: 80 }
        severity: { type: integer, minimum: 1, maximum: 5, default: 3 }
        driver_confidence: { type: integer, minimum: 1, maximum: 5, default: 3 }
        priority: { type: integer, minimum: 1, maximum: 5, default: 3 }
        note: { type: string, maxLength: 2000 }

    TuningMapCorner:
      type: object
      description: "C# TuningMapCornerIdentity: a turn as the driver verified it (start, apex, end form a forward arc, tuning_engine._normalized_corner)."
      additionalProperties: false
      required: [corner_id, label, start_pct, apex_pct, end_pct, is_official, user_verified]
      properties:
        corner_id: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 160 }
        start_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        apex_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        end_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
        is_official: { type: boolean }
        user_verified: { type: boolean }

    TuningMapSubmission:
      type: object
      description: |
        C# TuningMapSubmissionIdentity without its two hashes. The server adds geometry_hash (the
        analysis's TuningMapView.geometry_hash; 422 when it is not 64 hex) and annotation_hash
        (tuning_engine.map_annotation_hash: corners normalized and sorted by start, apex, end,
        corner_id, pcts rounded to 6 places, source_type canonicalized, hashed as Python
        json.dumps(sort_keys=True, separators=(",", ":"), ensure_ascii=False), floats in Python
        repr) before calling the worker, so the browser never formats hash input. Closed because
        the worker's input schema is closed (mcp_server.py:739-754).
      additionalProperties: false
      required: [track_configuration_key, source_type, verified, corners]
      properties:
        map_identity: { type: string, maxLength: 160 }
        track_configuration_key: { type: string, minLength: 1, maxLength: 200, description: "identity.track_configuration_key of the driving analysis." }
        source_type:
          type: string
          description: "Canonical (worker enum) or a C#/worker alias: official-iracing, iracing-game, official-nascar, official-track, user-confirmed."
          enum: [iracing-official, iracing-hud-capture, nascar-official, venue-official, verified-manual, telemetry-derived, official-iracing, iracing-game, official-nascar, official-track, user-confirmed]
        source_label: { type: string, maxLength: 200 }
        source_url: { type: string, maxLength: 2000 }
        verified: { type: boolean }
        corners: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/TuningMapCorner" } }

    TuningRecommendRequest:
      type: object
      description: "Server forwards to recommend_structured_open_setup_tuning with analysis paths resolved from the ids; ai_response is never sent in v1."
      required: [feedback, map_identity]
      properties:
        open_target_analysis_id: { type: [string, "null"], description: "Required when the driving analysis's setup_type is not Open." }
        feedback: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/TuningFeedbackItem" } }
        representative_run_ids: { type: array, maxItems: 3, uniqueItems: true, items: { type: string, maxLength: 80 }, description: "run_number values as decimal text." }
        map_identity: { $ref: "#/components/schemas/TuningMapSubmission" }
        ruleset_id: { type: [string, "null"], enum: [nascar-oreilly-xfinity-2026s3-v1, null] }
        goal: { type: [string, "null"], enum: [long-run-pace, tire-life, restart-pace, stability, null] }
        generic_note: { type: [string, "null"], maxLength: 4000 }
        maximum_changes: { const: 1 }

    TuningOutcomeRequest:
      type: object
      required: [outcome, notes]
      properties:
        outcome: { type: string, enum: [improved, worse, no-change, inconclusive] }
        notes: { type: string, maxLength: 8000 }
        result_analysis_id: { type: [string, "null"] }

    NoteSubjectKind:
      type: string
      enum: [session, setup, analysis]

    NoteCreate:
      type: object
      required: [subject_kind, subject_id, body]
      properties:
        subject_kind: { $ref: "#/components/schemas/NoteSubjectKind" }
        subject_id: { type: string, maxLength: 128 }
        body: { type: string, maxLength: 16384 }

    NoteUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 16384 }

    Note:
      allOf:
        - { $ref: "#/components/schemas/NoteCreate" }
        - type: object
          required: [note_id, customer_id, version, created_at, updated_at]
          properties:
            note_id: { type: integer }
            customer_id: { type: integer }
            version: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    TraceLayoutWrite:
      type: object
      required: [name, body]
      properties:
        name: { type: string, maxLength: 80 }
        body:
          type: object
          description: "Up to 10 rows, up to 2 signals per row (AnalysisTraceLayout)."
          required: [rows]
          properties:
            rows:
              type: array
              maxItems: 10
              items:
                type: object
                required: [row_id, signals]
                properties:
                  row_id: { type: string }
                  label: { type: [string, "null"] }
                  signals: { type: array, minItems: 1, maxItems: 2, items: { type: string } }

    TraceLayout:
      allOf:
        - { $ref: "#/components/schemas/TraceLayoutWrite" }
        - type: object
          required: [layout_id, version, builtin]
          properties:
            layout_id: { type: string }
            version: { type: integer }
            builtin: { type: boolean }

    LiveTileStyle:
      type: string
      enum: [number, gauge, bar, trend, status]

    LiveTile:
      type: object
      required: [tile_id, metric, row, column, row_span, column_span, style]
      properties:
        tile_id: { type: string, maxLength: 64 }
        metric: { type: string, description: "Tile id from live-channels.json tiles[]." }
        row: { type: integer, minimum: 0, maximum: 7 }
        column: { type: integer, minimum: 0, maximum: 7 }
        row_span: { type: integer, minimum: 1, maximum: 8 }
        column_span: { type: integer, minimum: 1, maximum: 8 }
        style: { $ref: "#/components/schemas/LiveTileStyle" }
        unit: { type: [string, "null"], description: "A live-channels.json tiles[].units id (C, F, m/s2, lap, mph, ...), never a display label (°C). Null or an id the tile does not list selects the tile's default unit. D12 maps legacy labels (°C, °F, m/s², laps) to ids." }
        precision: { type: [integer, "null"], minimum: 0, maximum: 3 }
        trend_window: { type: [string, "null"], enum: [s15, s30, s60, one_lap, three_laps, null] }
        accent: { type: [string, "null"], enum: [default, blue, green, amber, coral, violet, null] }
        highlight_abs: { type: boolean, default: false }

    LiveLayoutBody:
      type: object
      required: [rows, columns, tiles]
      properties:
        rows: { type: integer, minimum: 1, maximum: 8 }
        columns: { type: integer, minimum: 1, maximum: 8 }
        tiles: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/LiveTile" } }

    LiveLayoutWrite:
      type: object
      required: [name, body]
      properties:
        name: { type: string, maxLength: 80 }
        body: { $ref: "#/components/schemas/LiveLayoutBody" }

    LiveLayout:
      allOf:
        - { $ref: "#/components/schemas/LiveLayoutWrite" }
        - type: object
          required: [layout_id, version, builtin]
          properties:
            layout_id: { type: string }
            version: { type: integer }
            builtin: { type: boolean }

    LiveLayoutList:
      type: object
      required: [layouts, active_layout_id]
      properties:
        layouts: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/LiveLayout" } }
        active_layout_id: { type: string }

    LastInvestigation:
      type: object
      required: [session_id, analysis_id, view]
      properties:
        session_id: { type: integer }
        analysis_id: { type: string }
        view: { type: string, enum: [race, runs, sections, traces] }
        comparison_id: { type: [string, "null"] }
        section_id: { type: [string, "null"] }

    DriverPrefsWrite:
      type: object
      properties:
        active_live_layout_id: { type: [string, "null"] }
        active_trace_layout_id: { type: [string, "null"] }
        last_investigation: { oneOf: [{ $ref: "#/components/schemas/LastInvestigation" }, { type: "null" }] }
        theme_color: { type: [string, "null"], maxLength: 16 }
        reduced_motion: { type: [boolean, "null"] }
        safe_glance: { type: [boolean, "null"], description: "Live cue safe-glance hold (default true)." }
        units: { type: [object, "null"], additionalProperties: { type: string } }

    DriverPrefs:
      allOf:
        - { $ref: "#/components/schemas/DriverPrefsWrite" }
        - type: object
          required: [customer_id, version]
          properties:
            customer_id: { type: integer }
            version: { type: integer }

    JobKind:
      type: string
      enum: [discover, analyze, project, archive, restage, setup_files, setup_compare, baseline, tuning_recommend, tuning_outcome, tuning_history, import, snapshot, reanalyze]

    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted, deferred]

    JobRef:
      type: object
      required: [job_id, kind, state]
      properties:
        job_id: { type: integer }
        kind: { $ref: "#/components/schemas/JobKind" }
        state: { $ref: "#/components/schemas/JobState" }

    Job:
      allOf:
        - { $ref: "#/components/schemas/JobRef" }
        - type: object
          required: [lane, priority, created_at, attempts]
          properties:
            lane: { type: string, enum: [analysis, light, io, server] }
            priority: { type: integer }
            customer_id: { type: [integer, "null"] }
            subject: { type: object, additionalProperties: true }
            attempts: { type: integer }
            created_at: { type: string, format: date-time }
            started_at: { type: [string, "null"], format: date-time }
            finished_at: { type: [string, "null"], format: date-time }
            error_code: { type: [string, "null"], description: "worker_oom, worker_crash, timeout, tool_error, exceeds_memory_budget, nas_unreachable, ..." }
            error_message: { type: [string, "null"] }
            result: { type: [object, "null"], additionalProperties: true, description: "Tool result for Python-backed jobs (validated against its MCP contract where one exists)." }

    UploadKind:
      type: string
      enum: [ibt, sto, htm]

    UploadStateName:
      type: string
      enum: [open, verified, parsed, discovered, archived, analysis_queued, analyzed, deferred, failed]

    UploadCreate:
      type: object
      required: [sha256, size, kind, file_name, collector_id]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 1, maximum: 4294967296 }
        kind: { $ref: "#/components/schemas/UploadKind" }
        file_name: { type: string, maxLength: 512 }
        relative_path: { type: [string, "null"], maxLength: 1024, description: "For setup files: path under Documents\\iRacing\\setups, forward slashes." }
        source_mtime: { type: [string, "null"], format: date-time }
        collector_id: { type: string, format: uuid }
        customer_id: { type: [integer, "null"], description: "Driver the collector last saw in session info when it listed the file; recorded on the occurrence. Recordings are attributed from the IBT at ingest instead." }

    UploadState:
      type: object
      required: [sha256, state, offset, size]
      properties:
        sha256: { type: string }
        state: { $ref: "#/components/schemas/UploadStateName" }
        offset: { type: integer }
        size: { type: integer }

    ImportBundle:
      type: object
      description: "Built by tools/migrate from a copy of the legacy data root (D12). Converted once."
      required: [bundle_version, customer_id, source]
      properties:
        bundle_version: { const: 1 }
        customer_id: { type: integer }
        source:
          type: object
          required: [machine, root]
          properties:
            machine: { type: string }
            root: { type: string }
            app_version: { type: [string, "null"] }
            archive_id: { type: [string, "null"] }
        notes:
          type: array
          description: "Legacy notes. subject_id is ignored; the server resolves subject_ref after re-ingest and discovery. Unresolved notes become legacy_items (kind note) and are listed in the migration report."
          items:
            allOf:
              - { $ref: "#/components/schemas/NoteCreate" }
              - type: object
                required: [legacy_id, subject_ref]
                properties:
                  legacy_id: { type: string }
                  subject_ref:
                    type: object
                    description: "Stable identity of the subject, independent of new ids."
                    properties:
                      recording_sha256: { type: array, items: { type: string } }
                      subsession_id: { type: [integer, "null"] }
                      sim_session_num: { type: [integer, "null"] }
                      car_path: { type: [string, "null"] }
                      setup_values_fingerprint: { type: [string, "null"] }
                      sto_sha256: { type: [string, "null"] }
                      legacy_analysis_id: { type: [string, "null"] }
        trace_layouts: { type: array, items: { $ref: "#/components/schemas/TraceLayoutWrite" } }
        live_layouts: { type: array, items: { $ref: "#/components/schemas/LiveLayoutWrite" } }
        prefs: { oneOf: [{ $ref: "#/components/schemas/DriverPrefsWrite" }, { type: "null" }] }
        tuning_drafts:
          type: array
          description: |
            Legacy Progressive Tuning drafts (the desktop app's portable-settings/tuning-drafts). A
            legacy key cannot be reused: draft_identity_key (TuningContext) hashes the analysis_id and
            the binding, which re-ingest and re-analysis change. The server resolves legacy_analysis_id
            through legacy_analyses (the same map it gives import_legacy_tuning_experiments) to the
            session's current analysis, computes that analysis's draft_identity_key exactly as
            GET .../tuning does, and stores the body under it; body.open_target_analysis_id is rewritten
            through the same map (null when unresolved). A draft whose legacy_analysis_id is null or
            absent, does not resolve, or whose analysis has no projected tuning context, and a draft
            whose new key an earlier draft of the bundle already took (bundle order), is stored as a
            legacy_items row (kind tuning_draft, body = the bundle item). The import summary counts
            tuning_drafts (stored under a new key) and tuning_drafts_unresolved (parked).
          items:
            type: object
            required: [identity_key, body]
            properties:
              identity_key: { type: string, description: "The legacy draft's key (its file name), kept for the migration report; never used as the new key." }
              legacy_analysis_id: { type: [string, "null"], maxLength: 128, description: "The legacy draft's representativeSession.analysisId; must also be listed in legacy_analyses with its stable identity." }
              body: { type: object, additionalProperties: true }
        turn_annotations:
          type: array
          items:
            type: object
            required: [track_config_key, map_identity, body]
            properties:
              track_config_key: { type: string }
              map_identity: { type: string }
              body: { type: object, additionalProperties: true }
        legacy_analyses:
          type: array
          maxItems: 5000
          description: "Stable identity of every legacy analysis that legacy notes, tuning drafts or tuning experiments reference. The server resolves each to the matching session's current analysis (null when unresolved) and passes the map to import_legacy_tuning_experiments."
          items:
            type: object
            required: [legacy_analysis_id]
            properties:
              legacy_analysis_id: { type: string, maxLength: 128 }
              recording_sha256: { type: array, items: { type: string } }
              subsession_id: { type: [integer, "null"] }
              sim_session_num: { type: [integer, "null"] }
        legacy_archive:
          type: [object, "null"]
          description: "The legacy worker archive's history.sqlite3 and tuning/ files, copied byte for byte. The server writes them under the import job root's legacy/ and runs import_legacy_tuning_experiments (worker-interface.md section 4) on them; nothing else reads them. The worker's own tuning/drafts/*.json travel here and are not converted: they are write-only records of past recommend calls (the worker never reads one back) and the next recommend call writes its own. They stay preserved verbatim because the server keeps every accepted bundle at import/<bundle_sha256>.json under COACH_DATA_DIR and never deletes it."
          required: [files]
          properties:
            files:
              type: array
              maxItems: 5000
              items:
                type: object
                required: [relative_path, sha256, content_base64]
                properties:
                  relative_path: { type: string, maxLength: 1024, description: "history.sqlite3 or tuning/..., forward slashes, no .. segments." }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                  content_base64: { type: string }
        legacy_items:
          type: array
          description: "Parked features' data preserved verbatim (saved Tests, plans, trials, activity)."
          items:
            type: object
            required: [kind, source_path, body]
            properties:
              kind: { type: string }
              source_path: { type: string }
              body: { type: object, additionalProperties: true }

    # ---- Server-sent events ----
    ServerEvent:
      oneOf:
        - { $ref: "#/components/schemas/PresenceEvent" }
        - { $ref: "#/components/schemas/RecordingStateEvent" }
        - { $ref: "#/components/schemas/JobStateEvent" }
        - { $ref: "#/components/schemas/AnalysisReadyEvent" }
        - { $ref: "#/components/schemas/LibraryChangedEvent" }

    PresenceEvent:
      type: object
      required: [type, collector]
      properties:
        type: { const: presence }
        collector: { $ref: "#/components/schemas/CollectorPresence" }

    RecordingStateEvent:
