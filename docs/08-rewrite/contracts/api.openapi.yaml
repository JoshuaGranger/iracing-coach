        season_name: { type: [string, "null"] }
        is_fixed_setup: { type: [boolean, "null"], description: "WeekendInfo.WeekendOptions.IsFixedSetup of the session's first recording that states it: true fixed setup, false open setup, null when the recording does not say (never read as open)." }
        subsession_id: { type: [integer, "null"] }
