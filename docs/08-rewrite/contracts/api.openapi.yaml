openapi: 3.1.0
info:
  title: iRacing Coach server API
  version: "1"
  description: |
    HTTP API used by the browser SPA and the collector's uploads, plus the JSON messages of the
    collector WebSocket (`collector-protocol.md`) and the live WebSocket (`live-frame.md`).
    Single source of truth for wire types (see README.md). No authentication (D7).
    Conventions:
    - IDs: `customer_id` (iRacing customer id, integer), `session_id` (integer), `analysis_id` (string),
      `setup_id` (integer), `job_id` (integer), `sha256` (lowercase hex).
    - Times are UTC ISO-8601. Nullable means "not measured / unknown", never zero.
    - Mutable user-authored resources carry `version`; writes send `If-Match: <version>`; a stale
      version returns 412 with the current resource.
    - Every POST, PUT and DELETE from the browser outbox carries `Idempotency-Key: <uuid>` (the
      client operation id, persisted with the queued write). The server stores the key with the
      response status and body for 7 days (`request_log` in `db-schema.sql`); a retry with the same
      key returns the stored response and performs nothing. A key reused with a different method or
      path returns 422. Uploads are idempotent by `sha256` instead.
    - Long or Python-backed work returns `202 JobRef`; progress arrives on `/api/v1/events`
      (`job_state`) and the result at `GET /api/v1/jobs/{job_id}`.
    - View payloads carry `ETag: "<analysis_id>-p<projection_version>"` and `Cache-Control: no-cache`.
    - `x-max-bytes` on a response is a hard server-side bound; exceeding it is a server defect.
    - Readers ignore and preserve unknown optional fields. Objects marked `x-source` pass a backend
      subtree through unchanged; its shape is owned by the named Python contract or module.
    - `x-consumed-fields` on an `x-source` object lists every backend field the web workstreams
      (W7, W8) read from it, as paths relative to the object: `a.b` nested key, `a[]` each array
      element, `a[][]` nested arrays, `*` any key. The projector (W5) copies the whole subtree; when
      a view must shrink to its `x-max-bytes`, only subtrees and fields outside these lists may be
      dropped. An empty list means no v1 screen reads the subtree. The browser reads nothing else
      from an `x-source` object; reading a new field is an additive contract change.
servers:
  - url: http://192.168.1.81:8210
  - url: http://minipc.tail4e6ca6.ts.net:8210

tags:
  - name: system
  - name: library
  - name: views
  - name: setups
  - name: tuning
  - name: user-data
  - name: jobs
  - name: ingest
  - name: live
  - name: admin

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness for the Compose healthcheck (DB open, migrations applied; independent of the NAS).
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/status:
    get:
      tags: [system]
      summary: Server, NAS, queue and collector state.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStatus" }

  /api/v1/events:
    get:
      tags: [system]
      summary: Server-sent events. One stream per tab; `data:` is one ServerEvent JSON object; `event:` equals its `type`.
      parameters:
        - { name: customer_id, in: query, required: false, schema: { type: integer }, description: Limit driver-scoped events to one driver. }
      responses:
        "200":
          description: text/event-stream of ServerEvent
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ServerEvent" }

  /api/v1/drivers:
    get:
      tags: [library]
      summary: Drivers that have data (D7 landing). One driver -> the SPA opens that driver directly.
      parameters:
        - { $ref: "#/components/parameters/Library" }
      responses:
        "200":
          description: Drivers (`session_count` and `last_session_at` count the asked library's sessions)
          x-max-bytes: 65536
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/drivers/{customer_id}:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [library]
      parameters:
        - { $ref: "#/components/parameters/Library" }
      responses:
        "200":
          description: Driver (`session_count` and `last_session_at` count the asked library's sessions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/drivers/{customer_id}/sessions:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [library]
      summary: Sessions library, newest first. Filtering is server-side; grouping into events uses `event_key`.
      description: |
        Every filter narrows the list; values within one filter are alternatives (`car=a&car=b` is a or b), different
        filters must all hold. `car`, `track`, `series` and `type` may repeat. A value that matches nothing returns an
        empty page, not an error.
      parameters:
        - name: type
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [all, race, qualify, practice, test] } }
          description: "Session type; repeat for several. `all` anywhere means no type filter."
        - name: car
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, maxLength: 200 } }
          description: "`car_path` values (`CarTrackOptions.cars[].car_path`), exact."
        - name: track
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, maxLength: 200 } }
          description: "Track names (`CarTrackOptions.tracks[].track`), exact, any layout."
        - name: series
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, maxLength: 200 } }
          description: "Series names (`CarTrackOptions.series[].series_name`), exact."
        - name: setup
          in: query
          schema: { type: string, enum: [fixed, open] }
          description: "Fixed-setup or open-setup sessions (`SessionSummary.is_fixed_setup`); sessions whose recording does not say are in neither."
        - { name: q, in: query, schema: { type: string, maxLength: 120 }, description: "Text over track, layout, car, series." }
        - { $ref: "#/components/parameters/Library" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of sessions (of one library, `main` unless `library=lab`)
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/drivers/{customer_id}/cars-and-tracks:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [setups]
      summary: Cars and tracks seen in this driver's recordings (Find a baseline choices).
      parameters:
        - { $ref: "#/components/parameters/Library" }
      responses:
        "200":
          description: Options from the asked library's recordings
          x-max-bytes: 262144
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarTrackOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/sessions/{session_id}:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      tags: [library]
      responses:
        "200":
          description: Session detail
          x-max-bytes: 131072
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/analysis:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      tags: [library]
      summary: Queue (re)analysis. Idempotent while one is queued or running for the same profile.
      x-idempotency: >-
        Keyed by the analysis key (`jobs.idempotency_key`: session, membership digest, analyzer bundle
        digest, profile). A job with that key that is queued, running or succeeded is returned as it is
        and nothing is queued, so an analysis whose recordings, analyzer and profile are unchanged is never
        re-run; a failed, cancelled or interrupted one goes back to queued under the same job_id, and a
        deferred one stays deferred while it exceeds the admission ceiling.
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`no_recordings`: the session has no recordings, so there is nothing to analyse; nothing is queued"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/analyses/{analysis_id}/race:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Race view (overview, laps, timeline, pit stops, incidents, conditions).
      responses:
        "200":
          description: Race view
          x-max-bytes: 2097152
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/runs:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      responses:
        "200":
          description: Runs view
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunsView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/investigation:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Sections and comparisons (race_investigation, schema 2, projection sections-trials-v8).
      responses:
        "200":
          description: Investigation view
          x-max-bytes: 4194304
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/traces/catalog:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Laps, signals, bins and steering basis for the Traces workspace.
      responses:
        "200":
          description: Trace catalog
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceCatalog" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/traces:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: |
        Lap traces (`bins_per_lap` bins a lap) as a columnar binary container (`application/vnd.coach.columns`):
        bytes 0-3 "CCOL", u16 version 1, u16 reserved 0, u32 header length H, H bytes of UTF-8 JSON
        `TraceBlobHeader`, zero padding up to the data section, which starts at the first file offset
        at or after 12 + H that is a multiple of 8, then for each channel in header order a
        little-endian typed array of `laps.length x bins` values, lap-major, each array starting at
        its `offset` (from the start of the data section, a multiple of 8; zero padding between
        arrays). Bin i of a lap lies at lap fraction (i + 0.5) / bins, the backend's `lap_pct` for
        that distance bucket; a bucket the backend left empty is missing in every channel. Missing
        values are NaN (floats) or the channel's `missing` sentinel. Compressed with gzip/br when the
        client accepts it.
        Encoding rule: each channel copies one backend `lap_traces` point key (`TraceSignal.source_key`)
        in the backend's unit. Non-integer values are `f64` (exact copy of the Python double); `i16`/`u8`
        only for keys whose every value is an integer in range, with a `missing` sentinel outside the
        observed range; null, absent and non-finite backend values are missing. W5 tests that decoding
        every channel reproduces each backend value and its missingness exactly.
      parameters:
        - name: laps
          in: query
          description: Comma list of lap numbers or ranges (e.g. `1-40,52`); default all laps.
          schema: { type: string, maxLength: 2048 }
        - name: channels
          in: query
          description: Comma list of signal ids from the catalog; default the catalog's default set.
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Columnar traces
          x-max-bytes: 16777216
          headers:
            X-Coach-Trace-Laps: { schema: { type: integer }, description: "Number of laps in the body: the length of its TraceBlobHeader `laps` array." }
          content:
            application/vnd.coach.columns:
              schema: { type: string, format: binary }
              x-header-schema: { $ref: "#/components/schemas/TraceBlobHeader" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }
        "413":
          description: "Selection exceeds 16 MiB; narrow `laps` or `channels`. Only an analysis near the bound with every lap and channel selected reaches it; the browser then requests lap ranges (for example halves) and joins them."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/analyses/{analysis_id}/track:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [views]
      summary: Track geometry in the backend's normalized_local_vector space, copied without reprojection (map and cursor).
      responses:
        "200":
          description: Track geometry
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackGeometry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/drivers/{customer_id}/setups:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [setups]
      summary: Setup library (D9). Every setup seen in any recording, garage capture or export, plus `.sto` files with values unknown.
      parameters:
        - { name: car_path, in: query, schema: { type: string, maxLength: 160 } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: raced_only, in: query, schema: { type: boolean, default: false } }
        - { name: raced, in: query, schema: { type: boolean }, description: "true: only setups seen in a race recording (as `raced_only`, and `unlinked_files` is empty); false: only setups never raced; absent: both. Overrides `raced_only`." }
        - $ref: "#/components/parameters/Library"
          description: >-
            Setup usage of one library: `observation_count`, `sources` and `raced` count that library's recordings
            (garage visits and exports count in `main`), and a setup with no use there is left out. Names and `.sto`
            links come from every observation. With `lab`, `unlinked_files` is empty.
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of setups
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/setups/{setup_id}:
    parameters:
      - { name: setup_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [setups]
      parameters:
        - $ref: "#/components/parameters/Library"
          description: >-
            Setup usage of one library, as the list: `setup.observation_count`, `sources`, `raced` and `raced_count` count that
            library's recordings (garage visits and exports count in `main`), and `versions` lists the versions with use there.
            Names, values and `observations` come from every observation.
      responses:
        "200":
          description: Setup detail
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/setups/compare:
    post:
      tags: [setups]
      summary: Compare two setups of the same car (Python `compare_iracing_setups`). Answers inline when done within the server's inline wait (default 10 s), else 202.
      description: >-
        One job per worker bundle, value sets and scheme: the same pair asked again (in the same order) answers from that
        finished job, a failed one runs again. `SetupVersion.changed_count` reads these finished comparisons.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupCompareRequest" }
      responses:
        "200":
          description: Comparison
          x-max-bytes: 524288
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCompareResult" }
        "202": { $ref: "#/components/responses/Accepted" }
        "422":
          description: "`different_cars`, `values_unknown`, or `different_schemes` (one setup is known only from a garage export, the other from a recording: their keys differ and every row would read unknown)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/drivers/{customer_id}/baseline:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    post:
      tags: [setups]
      summary: Find a baseline (Python `build_open_setup_package`). Result is `contracts/setup-package-v1.schema.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaselineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/analyses/{analysis_id}/tuning:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    get:
      tags: [tuning]
      summary: "Progressive Tuning context for one analysis (eligibility, exact identity, turn map, representative runs). Unlike the view payloads it carries no ETag, because the server merges request-time fields (`binding`, `open_targets`, `draft_identity_key`) into the projected `tuning.json`; it is sent with Cache-Control no-cache."
      responses:
        "200":
          description: Tuning context
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningContext" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectionPending" }

  /api/v1/analyses/{analysis_id}/tuning/recommendations:
    parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
    post:
      tags: [tuning]
      summary: Structured recommendation (Python `recommend_structured_open_setup_tuning`, no AI). Result is `contracts/tuning-recommendation-v1.schema.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningRecommendRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning/experiments/{experiment_id}/outcome:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: experiment_id, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      tags: [tuning]
      summary: Record an experiment outcome (Python `record_open_setup_feedback`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningOutcomeRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning/history:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [tuning]
      summary: Tuning history for an analysis context (Python `iracing_setup_history`).
      parameters:
        - { name: analysis_id, in: query, required: true, schema: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/drivers/{customer_id}/tuning-drafts/{identity_key}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: identity_key, in: path, required: true, schema: { type: string, maxLength: 256 } }
    get:
      tags: [user-data]
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningDraft" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TuningDraftWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TuningDraft" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/turn-annotations/{track_config_key}/{map_identity}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: track_config_key, in: path, required: true, schema: { type: string, maxLength: 256 } }
      - { name: map_identity, in: path, required: true, schema: { type: string, maxLength: 128 } }
    get:
      tags: [user-data]
      responses:
        "200":
          description: Turn-name corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnAnnotations" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TurnAnnotationsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnAnnotations" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/notes:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      parameters:
        - { name: subject_kind, in: query, required: true, schema: { $ref: "#/components/schemas/NoteSubjectKind" } }
        - { name: subject_id, in: query, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Notes for one subject
          x-max-bytes: 1048576
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/Note" } }
    post:
      tags: [user-data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /api/v1/notes/{note_id}:
    parameters:
      - { name: note_id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/trace-layouts:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Named trace layouts (Default is built in and immutable)
          x-max-bytes: 1048576
          content:
            application/json:
              schema:
                type: object
                required: [layouts]
                properties:
                  layouts: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/TraceLayout" } }

  /api/v1/drivers/{customer_id}/trace-layouts/{layout_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { $ref: "#/components/parameters/LayoutId" }
    put:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TraceLayoutWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceLayout" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/live-layouts:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Live dashboards (Default is built in and immutable) and the active one
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveLayoutList" }

  /api/v1/drivers/{customer_id}/live-layouts/{layout_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { $ref: "#/components/parameters/LayoutId" }
    put:
      tags: [user-data]
      summary: Save a live layout; if active, the server pushes it to the rig (`layout.set`).
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveLayoutWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveLayout" }
        "412": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [user-data]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted by the user }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/drivers/{customer_id}/prefs:
    parameters: [{ $ref: "#/components/parameters/CustomerId" }]
    get:
      tags: [user-data]
      responses:
        "200":
          description: Preferences, active live layout, last investigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPrefs" }
    put:
      tags: [user-data]
      summary: "Top-level merge: each field present in the body replaces the stored value (null clears it; `units` is replaced as a whole); absent fields keep their stored value. Sending the full body is valid."
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverPrefsWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPrefs" }
        "412": { $ref: "#/components/responses/VersionConflict" }

  /api/v1/jobs:
    get:
      tags: [jobs]
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/JobState" } }
        - { name: customer_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Jobs, newest first
          x-max-bytes: 524288
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }

  /api/v1/jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      responses:
        "200":
          description: Job with result when finished
          x-max-bytes: 4194304
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{job_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "409":
          description: Already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/uploads:
    post:
      tags: [ingest]
      summary: Create or resume an upload; idempotent by sha256 (collector-protocol.md section 4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCreate" }
      responses:
        "200":
          description: Existing upload (resume) or already received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "201":
          description: New upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "413": { description: Larger than 4 GiB }
        "503":
          description: Spool full; retry after `Retry-After` seconds
          headers:
            Retry-After: { schema: { type: integer } }

  /api/v1/uploads/{sha256}:
    parameters: [{ $ref: "#/components/parameters/Sha256" }]
    head:
      tags: [ingest]
      responses:
        "200":
          description: Upload known
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-State: { schema: { $ref: "#/components/schemas/UploadStateName" } }
        "404": { description: Unknown upload }
    put:
      tags: [ingest]
      summary: Append one chunk (<= 8 MiB) at the durable offset. The completing chunk triggers hash verification.
      parameters:
        - { name: Content-Range, in: header, required: true, schema: { type: string, pattern: "^bytes [0-9]+-[0-9]+/[0-9]+$" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        "200":
          description: Chunk durable (state open) or file verified (state verified)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "409":
          description: Offset mismatch; continue from `offset`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadState" }
        "422":
          description: Whole-file hash mismatch; the partial file is discarded; restart from 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/live/channels:
    get:
      tags: [live]
      summary: The live channel, cue and tile table the server was built with (`live-channels.json`).
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema: { type: object, additionalProperties: true, x-source: docs/08-rewrite/contracts/live-channels.json, x-consumed-fields: [table_version] }

  /ws/live/{customer_id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
      - { name: rate, in: query, schema: { type: integer, enum: [1, 10, 30, 60], default: 30 } }
    get:
      tags: [live]
      summary: WebSocket upgrade. First text message LiveHello, then backlog and live binary frames (live-frame.md). Counts as a viewer.
      x-websocket:
        server-text: { $ref: "#/components/schemas/LiveHello" }
        client-text: { $ref: "#/components/schemas/LiveRateChange" }
        server-binary: live-frame.md
      responses:
        "101": { description: Switching protocols }

  /ws/collector:
    get:
      tags: [live]
      summary: Collector WebSocket, subprotocol `coach-collector.1` (collector-protocol.md).
      x-websocket:
        client-text: { $ref: "#/components/schemas/CollectorClientMessage" }
        server-text: { $ref: "#/components/schemas/CollectorServerMessage" }
        client-binary: live-frame.md
      responses:
        "101": { description: Switching protocols }

  /api/v1/admin/import:
    post:
      tags: [admin]
      summary: One-time import of legacy user-authored data (D12). Idempotent by bundle hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBundle" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "200":
          description: Bundle already imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }

  /api/v1/admin/reanalyze:
    post:
      tags: [admin]
      summary: Queue analysis of every session (optionally one driver) whose current analysis is missing or older than the worker's profile.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id: { type: [integer, "null"] }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/admin/snapshot:
    post:
      tags: [admin]
      summary: Take a user-data snapshot now (local and NAS).
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/admin/remove:
    post:
      tags: [admin]
      summary: Remove named setup file entries and recordings (by hash) from the library, with their derived rows and views. Lists what would go unless `dry_run` is false.
      description: >-
        Library cleanup (test or mistaken uploads). Synchronous, one transaction, answers 200 with the report
        (nothing is queued). `dry_run` defaults to true: the report lists exactly what a real call would remove
        and changes nothing; a real call needs `"dry_run": false`.

        A **setup file entry** is every `setup_files` row whose file name equals `name` (case-insensitive; a name
        with a `/` is matched against `<car folder>/<path>`; one driver with `customer_id`). It goes together with
        the garage visits whose committed name is that file name, the setup observations of those visits and of
        the removed `.htm` blobs, and any setup left with no observation. A **recording** goes together with its
        setup observations, the sessions that held only that recording (and their analyses, view files, jobs and
        the driver's `last_investigation` pointer when it names them), the analyses of sessions that hold other
        recordings too (those sessions get a new analysis queued, over the remaining recordings), and every
        occurrence, upload and job row of its hash. Removed blobs lose their spool copy.

        Never touched: the NAS (raw files, manifests and every other NAS path), the collector's journal and the
        worker's per-driver archive (analysis JSON, `history.sqlite3`); user-authored rows are never deleted (a
        target with a note attached is `blocked` as `has_notes`). A blob whose NAS copy is not `archived` is kept
        (`blobs_kept`; a recording is `blocked` as `not_archived`), since the spool copy is then the only one.
        A target whose work is running is `blocked` as `job_running`; nothing of a blocked target is changed.
        Idempotent: a target already gone reports `found: false` and changes nothing. Each real call is logged
        (server log and the append-only `$COACH_DATA_DIR/run/admin-removals.jsonl`, one line holding the request
        and the report). `rebuild-index` reads the NAS manifests, so a removed hash returns if the index is
        rebuilt from the NAS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRemoveRequest" }
      responses:
        "200":
          description: The report (a plan when `dry_run` is true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRemoveReport" }
        "400":
          description: "`invalid_request`: neither `setup_files` nor `recordings` is given, or a field is malformed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/library/windows:
    get:
      tags: [admin]
      summary: The lab windows, newest start first, each with the number of recordings it filed lab.
      responses:
        "200":
          description: Windows
          x-max-bytes: 1048576
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabWindowList" }
    post:
      tags: [admin]
      summary: State a lab window (the iRacing-utility before it drives), or close one (the same start, car and track again with the end).
      description: >-
        A window says that the utility drives `car` at `track` from `from` until `until`. At ingest a recording is
        filed `lab` when its start (`start_time_utc`, both ends included) falls in a window, its `CarPath` or car
        screen name equals `car`, its `TrackName`, `TrackDisplayName` or `TrackID` equals `track` (case ignored), and it
        is a solo offline test (no `SubSessionID`, `EventType` Test): a hosted session or a race against AI is never
        lab. Anything else stays `main`. A window with the same `from`, `car` and `track` as a stored one is that
        window: its `until`, `note` and `source` are replaced (the utility opens a window with the planned end and
        posts it again with the time it stopped). Recordings already stored are not refiled by this call; that is
        `POST /api/v1/admin/library/classify`. Each call is logged (`$COACH_DATA_DIR/run/library.jsonl`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabWindowWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabWindow" }
        "200":
          description: The window with this start, car and track, updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabWindow" }
        "400":
          description: "`invalid_request`: a malformed field, `until` before `from`, longer than 72 hours, or a blank car or track"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/library/classify:
    post:
      tags: [admin]
      summary: Apply the lab windows to the stored recordings (the historical repair). Lists what would change unless `dry_run` is false.
      description: >-
        Every parsed recording (one driver with `customer_id`) is filed by the rule of
        `POST /api/v1/admin/library/windows`: `lab` inside a matching window, else `main` (a recording whose start
        falls in a window without the matching car, track or session kind stays main and is listed in
        `overlaps_kept_main`). Synchronous, one transaction; `dry_run` defaults to true and then nothing changes.
        Idempotent: a second real call reports no change. A real call is logged (server log and one line holding the
        report in `$COACH_DATA_DIR/run/library.jsonl`) and announces `library_changed` for the drivers it changed.
        Raw files, the NAS and analyses are never touched; a session follows its recordings (`SessionSummary.library`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryClassifyRequest" }
      responses:
        "200":
          description: The report (a plan when `dry_run` is true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryClassifyReport" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  parameters:
    CustomerId: { name: customer_id, in: path, required: true, schema: { type: integer } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: integer } }
    AnalysisId: { name: analysis_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    JobId: { name: job_id, in: path, required: true, schema: { type: integer } }
    LayoutId: { name: layout_id, in: path, required: true, schema: { type: string, maxLength: 64, pattern: "^[a-z0-9-]+$" } }
    Sha256: { name: sha256, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: "Current `version`; required to update or delete an existing resource." }
    Library:
      name: library
      in: query
      schema: { $ref: "#/components/schemas/Library" }
      description: >-
        Whose driving: `main` (the default when absent; Joshua's own) or `lab` (the iRacing-utility's bot, its setup
        harvest and other agent-driven rig runs). One library per request; Lab never enters the main counts. A session
        is `lab` when any of its recordings is (`SessionSummary.library`). Any other value is `400 invalid_request`.

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: "`invalid_request`: a parameter or the body is malformed"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Accepted:
      description: Job queued (or the existing equivalent job)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobRef" }
    ProjectionPending:
      description: Analysis exists but its view files are being (re)built; retry on `analysis_ready`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: Stale `If-Match`; body is the current resource under `current`
      content:
        application/json:
          schema:
            type: object
            required: [error, current]
            properties:
              error: { const: version_conflict }
              current: { type: object, additionalProperties: true }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: "Stable code, e.g. not_found, invalid_request, hash_mismatch, projection_pending, exceeds_memory_budget" }
        message: { type: string }
        details: { type: [object, "null"], additionalProperties: true }

    Health:
      type: object
      required: [status, server_version, schema_version]
      properties:
        status: { const: ok }
        server_version: { type: string }
        schema_version: { type: integer }

    NasState:
      type: string
      enum: [ok, readonly, unreachable, stalled]

    ServerStatus:
      type: object
      required: [server_version, api_version, collector_protocol, live_table_version, projection_version, nas, spool, queue, collectors, disk_free_bytes]
      properties:
        server_version: { type: string }
        api_version: { const: 1 }
        collector_protocol: { type: integer }
        live_table_version: { type: integer }
        projection_version: { type: integer }
        worker_profile_version: { type: [string, "null"] }
        python_version: { type: [string, "null"] }
        collector_newer_than_server: { type: boolean, description: "A connected collector sent live frames with a table_version above the server's; those frames are not relayed (live-frame.md)." }
        nas:
          type: object
          required: [state, pending_archive]
          properties:
            state: { $ref: "#/components/schemas/NasState" }
            last_ok_at: { type: [string, "null"], format: date-time }
            pending_archive: { type: integer }
        spool:
          type: object
          required: [bytes, files, limit_bytes]
          properties:
            bytes: { type: integer }
            files: { type: integer }
            limit_bytes: { type: integer }
        queue:
          type: object
          required: [analysis, light, deferred]
          properties:
            analysis: { type: integer }
            light: { type: integer }
            deferred: { type: integer }
        collectors: { type: array, items: { $ref: "#/components/schemas/CollectorPresence" } }
        disk_free_bytes: { type: integer }

    CollectorPresence:
      type: object
      required: [collector_id, machine, collector_version, protocol, compatible, online, last_seen_at, viewers]
      properties:
        collector_id: { type: string, format: uuid }
        machine: { type: string }
        collector_version: { type: string }
        protocol: { type: integer }
        compatible: { type: boolean }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        status: { oneOf: [{ $ref: "#/components/schemas/CollectorStatusBody" }, { type: "null" }] }
        viewers: { type: integer }

    Driver:
      type: object
      required: [customer_id, name, session_count, live]
      properties:
        customer_id: { type: integer }
        name: { type: string }
        irating: { type: [integer, "null"] }
        session_count: { type: integer }
        last_session_at: { type: [string, "null"], format: date-time }
        live: { type: boolean, description: "A connected collector reports this driver in a session (D5)." }

    DriverList:
      type: object
      required: [drivers]
      properties:
        drivers: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/Driver" } }

    AnalysisState:
      type: string
      enum: [none, queued, running, ready, failed, deferred]

    SessionOverview:
      type: object
      description: Library row figures (from discovery and the current analysis). Null = not measured.
      additionalProperties: true
      properties:
        starting_position: { type: [integer, "null"] }
        final_position: { type: [integer, "null"] }
        recorded_laps: { type: [integer, "null"] }
        green_laps_estimated: { type: [number, "null"] }
        caution_laps_estimated: { type: [number, "null"] }
        pit_stops_detected: { type: [integer, "null"] }
        runs_detected: { type: [integer, "null"] }
        longest_green_run: { type: [integer, "null"] }
        pace_slope_s_per_lap: { type: [number, "null"] }
        pace_slope_supported:
          type: [boolean, "null"]
          description: >-
            Whether the backend's screened fit had enough eligible laps by its own rule (`race_investigation.runs[].fit`, null
            with `fit_unavailable_reason` under three screened laps with known exposure): true when at least one run of the
            phase has a fit, false when none has. Read from the analysis, never recomputed. Null when there is no
            `pace_slope_s_per_lap` or the analysis reports no runs. Always sent.
        green_pace_median_s:
          type: [number, "null"]
          description: >-
            Median green-lap time of the phase, seconds: the median of the backend's `lap_time_s` over the green laps its own
            screen kept (`race_investigation.laps[].eligible`); no lap is screened again. Null without an analysis or when the
            screen kept no lap. Always sent.
        longest_run_laps:
          type: [integer, "null"]
          description: >-
            Laps of the phase's longest backend run: the complete laps between two pit or stall visits (`runs[].lap_numbers`
            as joined onto `race.json` `laps[].run_number`), so a reset to the pits or the garage starts a new run. The
            earlier run on a tie. Null when no lap names a run. Always sent.
        longest_run_pace_loss_s:
          type: [number, "null"]
          description: >-
            Observed pace loss over that run, seconds, 3 decimals: the last minus the first `lap_time_s` of its green laps
            the backend's screen kept (`race_investigation.laps[].eligible`), in lap order; negative when the run ended
            faster. A difference of two observed laps, not a fit. Null under three kept laps or without an investigation.
            Always sent.
        timed_lap_1_s:
          type: [number, "null"]
          description: >-
            The phase's first timed lap, seconds (`race.json` `laps[].lap_time_s`): the first lap in lap order that is
            complete, has a time, spent under 1 s on pit road and is neither a pit-in nor a pit-out lap, so an out lap is
            never one. The Sessions row shows it for qualifying. Null when there is none. Always sent.
        timed_lap_2_s:
          type: [number, "null"]
          description: "The second such lap; null when the phase has fewer than two. Always sent."
        field_size:
          type: [integer, "null"]
          description: >-
            Cars in the session's official results (`SessionInfo.Sessions[].ResultsPositions`, one per `CarIdx`), read from
            a recording of a later session of the same event, the only place the sim has written them final. Sent with
            `results_position`; null without such a recording (the last session of an event, offline sessions). Always sent.
        results_position:
          type: [integer, "null"]
          description: >-
            The driver's overall place in those results, counted by `Position` (never `ClassPosition`). It can differ from
            `final_position`, the last recorded position, when the session went on after the recording ended (a lone
            qualifying run). Null exactly when `field_size` is. Always sent.
        start_position:
          type: [integer, "null"]
          description: >-
            Races only: the official starting position, the driver's overall place in the grid
            (`QualifyResultsInfo.Results`) of a recording of this race or a later session; without one, the backend's
            position at the green flag (`starting_position`). A finish change is measured against it. Null for other
            sessions. Always sent.
        fuel_per_lap_gal:
          type: [number, "null"]
          description: >-
            Burn per green lap, US gallons: the backend's `strategy.measured_green_fuel_gal_per_lap` (the median of its
            runs' green-lap burn over laps with fuel readings), never recomputed. Null when the backend measured none.
            Always sent.
        best_green_lap_s:
          type: [number, "null"]
          description: >-
            Fastest green lap of the phase, seconds, traffic included: the minimum backend `lap_time_s` over its
            `race.json` `laps[]` rows that are complete, green for the whole lap (`green_fraction` 1 or `flag_state`
            green), under 1 s on pit road, neither a pit-in nor a pit-out lap, on track (`clean_context.on_track_fraction`
            at least 0.98 when given), carry no pit, tow or repair evidence (`damage_repair_context`) and no backend
            `exclusion_reasons` other than `close_traffic` or `restart`. Unlike `best_clean_lap_s` it does not leave out
            laps in close traffic, so a race run in a pack has one. The Sessions race line shows it. Null when no lap
            qualifies. Always sent.
        race_pace_median_s:
          type: [number, "null"]
          description: >-
            Median `lap_time_s` over the same laps as `best_green_lap_s` (4 decimals; the mean of the middle pair on an even
            count). `green_pace_median_s` stays the median of the screened laps. The Sessions race line shows it as Pace.
            Null when no lap qualifies. Always sent.
        finished:
          type: [boolean, "null"]
          description: >-
            Races only: whether the race reached its finish while the recording ran, the backend's
            `race_summary.finish.finished` (backlog #97). True when the race session's `SessionState` reached checkered or
            cool-down; false when it reached racing and never either, so the recording stopped before the race did (he
            left after a wreck) and `final_position` is where he was running, not a finish; null when unknown, for other
            sessions, and for analyses from before the field. Read, never decided by the server. Always sent.
        retired_lap:
          type: [integer, "null"]
          description: >-
            With `finished` false: the lap in progress when the recording ended (`race_summary.finish.last_lap`); the
            Sessions Finish slot reads `DNF · L14`. Null otherwise. Always sent.
        retired_position:
          type: [integer, "null"]
          description: >-
            With `finished` false: the position recorded when the recording ended (`race_summary.finish.position_at_end`),
            a running place, never a finish. Null otherwise. Always sent.
        pace_consistency_percent: { type: [number, "null"] }
        best_clean_lap_s: { type: [number, "null"] }
        fuel_used_gal: { type: [number, "null"] }

    SessionSummary:
