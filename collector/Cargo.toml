[package]
name = "coach-collector"
description = "Sim-PC collector: SDK reader, live overlay, garage capture, uploader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "coach_collector"
path = "src/lib.rs"

[[bin]]
name = "coach-collector"
path = "src/main.rs"

[dependencies]
coach-wire.workspace = true
coach-ibt.workspace = true
coach-live.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }

[dev-dependencies]
# The in-test server mock speaks WebSocket through tungstenite; the collector's own client is `src/ws.rs`.
tungstenite.workspace = true
sha2.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
