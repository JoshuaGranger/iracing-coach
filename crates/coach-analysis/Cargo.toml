[package]
name = "coach-analysis"
description = "Native analysis stages that replace Python worker stages under the parity gate (port phase 1: IBT decode)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coach-analysis"
path = "src/main.rs"

[dependencies]
coach-ibt.workspace = true
# Port phase 2: CPython-3.12-exact numeric primitives for the kernels.
coach-numerics = { path = "../coach-numerics" }
serde.workspace = true
# float_roundtrip: request and store headers carry Python floats that must parse exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
