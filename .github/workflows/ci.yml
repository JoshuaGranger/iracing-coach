name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: companion-app/global.json

      # Validates the runtimes the setup actions above actually provisioned,
      # through the same resolver the local entry points use. Static agreement
      # between this file and the toolchain contract is not runtime provenance.
      - name: Record toolchain provenance
        shell: pwsh
        run: |
          . .\tools\Resolve-Toolchain.ps1
          $python = Resolve-CoachPython -Required
          $node = Resolve-CoachNode -Required
          $dotnet = Resolve-CoachDotnet -GlobalJsonDirectory (Join-Path $PWD 'companion-app') -Required
          $provenance = Get-CoachToolchainProvenance -Python $python -Node $node -Dotnet $dotnet `
            -Required @('python', 'node', 'dotnet') -Authority 'ci-source-gate'
          Assert-CoachToolchain -Provenance $provenance -Required @('python', 'node', 'dotnet')
          Write-CoachToolchainProvenance -Provenance $provenance

      - name: Verify repository, contracts, fixtures, and backend
        shell: pwsh
        run: .\tools\verify-repository.ps1

      - name: Check first-party JavaScript syntax
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the checked-out source SHA." }
          $evidence = Join-Path $env:RUNNER_TEMP 'iracing-coach-javascript-syntax.json'
          .\tools\Invoke-JavaScriptSyntaxGate.ps1 `
            -RepositoryRoot $PWD.Path `
            -SourceSha $sha `
            -Authority ci-source-gate `
            -EventName '${{ github.event_name }}' `
            -OutputPath $evidence
          if ($LASTEXITCODE -ne 0) { throw "First-party JavaScript syntax-only gate failed." }
          Get-Content -LiteralPath $evidence -Raw

      - name: Retain JavaScript syntax-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-syntax-only-${{ github.run_id }}
          path: ${{ runner.temp }}\iracing-coach-javascript-syntax.json
          if-no-files-found: error

      - name: Test application
        shell: pwsh
        run: dotnet test .\companion-app\iRacingCoach.sln --configuration Release

      - name: Build application
        shell: pwsh
        run: dotnet build .\companion-app\iRacingCoach.sln --configuration Release --no-restore
