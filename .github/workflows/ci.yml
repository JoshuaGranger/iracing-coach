name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: companion-app/global.json

      # Validates the runtimes the setup actions above actually provisioned,
      # through the same resolver the local entry points use. Static agreement
      # between this file and the toolchain contract is not runtime provenance.
      - name: Record toolchain provenance
        shell: pwsh
        run: |
          . .\tools\Resolve-Toolchain.ps1
          $python = Resolve-CoachPython -Required
          $node = Resolve-CoachNode -Required
          $dotnet = Resolve-CoachDotnet -GlobalJsonDirectory (Join-Path $PWD 'companion-app') -Required
          $provenance = Get-CoachToolchainProvenance -Python $python -Node $node -Dotnet $dotnet `
            -Required @('python', 'node', 'dotnet') -Authority 'ci-source-gate'
          Assert-CoachToolchain -Provenance $provenance -Required @('python', 'node', 'dotnet')
          Write-CoachToolchainProvenance -Provenance $provenance

      - name: Verify repository, contracts, fixtures, and backend
        shell: pwsh
        run: .\tools\verify-repository.ps1

      - name: Check first-party JavaScript syntax
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the checked-out source SHA." }
          $evidence = Join-Path $env:RUNNER_TEMP 'iracing-coach-javascript-syntax.json'
          .\tools\Invoke-JavaScriptSyntaxGate.ps1 `
            -RepositoryRoot $PWD.Path `
            -SourceSha $sha `
            -Authority ci-source-gate `
            -EventName '${{ github.event_name }}' `
            -OutputPath $evidence
          if ($LASTEXITCODE -ne 0) { throw "First-party JavaScript syntax-only gate failed." }
          Get-Content -LiteralPath $evidence -Raw

      - name: Retain JavaScript syntax-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-syntax-only-${{ github.run_id }}
          path: ${{ runner.temp }}\iracing-coach-javascript-syntax.json
          if-no-files-found: error

      - name: Emit normalized evidence ladder
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve the checked-out source SHA.' }

          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $evidenceRoot = Join-Path $runnerTemp ('iracing-coach-evidence-' + [guid]::NewGuid().ToString('N'))
          $resolvedRoot = [IO.Path]::GetFullPath($evidenceRoot)
          if (-not $resolvedRoot.StartsWith($runnerTemp + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Evidence root escaped RUNNER_TEMP.' }
          New-Item -ItemType Directory -Path $resolvedRoot -ErrorAction Stop | Out-Null
          "EVIDENCE_ROOT=$resolvedRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

          . .\tools\Resolve-Toolchain.ps1
          $python = Resolve-CoachPython -Required
          $node = Resolve-CoachNode -Required
          $dotnet = Resolve-CoachDotnet -GlobalJsonDirectory (Join-Path $PWD 'companion-app') -Required
          $provenance = Get-CoachToolchainProvenance -Python $python -Node $node -Dotnet $dotnet `
            -Required @('python', 'node', 'dotnet') -Authority 'ci-source-gate'
          Assert-CoachToolchain -Provenance $provenance -Required @('python', 'node', 'dotnet')

          $registryPath = Join-Path $PWD 'tools\evidence\evidence-declarations.json'
          $registry = Get-Content -LiteralPath $registryPath -Raw | ConvertFrom-Json
          $activeFamilies = @($registry.declarations | ForEach-Object { $_.family } | Sort-Object -Unique)
          $failures = New-Object System.Collections.Generic.List[string]

          $backendRaw = Join-Path $resolvedRoot 'raw-backend.json'
          & $python.Resolved.Path -X utf8 .\tools\evidence\emit_python_results.py `
            --family backend --start-dir .\iracing-coach\tests --pattern 'test_*.py' --out $backendRaw
          if ($LASTEXITCODE -ne 0) { $failures.Add("backend-producer:$LASTEXITCODE") | Out-Null }

          $devtoolsRaw = Join-Path $resolvedRoot 'raw-devtools.json'
          & $python.Resolved.Path -X utf8 .\tools\evidence\emit_python_results.py `
            --family devtools --start-dir .\tools\dev\tests --pattern 'test_*.py' --out $devtoolsRaw
          if ($LASTEXITCODE -ne 0) { $failures.Add("devtools-producer:$LASTEXITCODE") | Out-Null }

          & $dotnet.Resolved.Path restore .\companion-app\iRacingCoach.sln --nologo
          if ($LASTEXITCODE -ne 0) { $failures.Add("dotnet-restore:$LASTEXITCODE") | Out-Null }
          $trx = Join-Path $resolvedRoot 'dotnet.trx'
          & $dotnet.Resolved.Path test .\companion-app\iRacingCoach.sln --configuration Release --no-restore `
            --logger "trx;LogFileName=dotnet.trx" --results-directory $resolvedRoot -m:1
          if ($LASTEXITCODE -ne 0) { $failures.Add("dotnet-producer:$LASTEXITCODE") | Out-Null }

          $inputs = [ordered]@{ backend = $backendRaw; devtools = $devtoolsRaw; dotnet = $trx }
          foreach ($family in @('backend', 'devtools', 'dotnet')) {
            if ($activeFamilies -notcontains $family) {
              Write-Host "$family evidence is Open pending a reviewed declaration family."
              continue
            }
            try {
              & .\tools\New-EvidenceReport.ps1 -RepositoryRoot $PWD.Path -SourceSha $sha -Family $family `
                -InputPath $inputs[$family] -RegistryPath $registryPath -Authority ci-source-gate `
                -ToolchainProvenance $provenance -OutputPath (Join-Path $resolvedRoot "normalized-$family.json")
            }
            catch { $failures.Add("$family-normalizer") | Out-Null }
          }

          $javascriptRaw = Join-Path $env:RUNNER_TEMP 'iracing-coach-javascript-syntax.json'
          try {
            & .\tools\New-EvidenceReport.ps1 -RepositoryRoot $PWD.Path -SourceSha $sha -Family javascript `
              -InputPath $javascriptRaw -Authority ci-source-gate -ToolchainProvenance $provenance `
              -OutputPath (Join-Path $resolvedRoot 'normalized-javascript.json')
          }
          catch { $failures.Add('javascript-normalizer') | Out-Null }

          if ($failures.Count -gt 0) { throw ('Evidence ladder failed: ' + ($failures -join ', ')) }

      - name: Retain normalized evidence ladder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ladder-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_ROOT }}\normalized-devtools.json
            ${{ env.EVIDENCE_ROOT }}\normalized-backend.json
            ${{ env.EVIDENCE_ROOT }}\normalized-dotnet.json
            ${{ env.EVIDENCE_ROOT }}\normalized-javascript.json
          if-no-files-found: error

      - name: Remove exact evidence root
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:EVIDENCE_ROOT) -and (Test-Path -LiteralPath $env:EVIDENCE_ROOT)) {
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            $target = [IO.Path]::GetFullPath($env:EVIDENCE_ROOT)
            if (-not $target.StartsWith($runnerTemp + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Cleanup target escaped RUNNER_TEMP.' }
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
          }

      - name: Build application
        shell: pwsh
        run: dotnet build .\companion-app\iRacingCoach.sln --configuration Release --no-restore
